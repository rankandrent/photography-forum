name: Publish next location page

# One new city page per day. The push triggers the Cloudflare build/deploy.
on:
  schedule:
    - cron: "7 14 * * *" # 14:07 UTC ≈ 9–10am US Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-location
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish one page
        id: pub
        run: |
          out="$(node scripts/publish-next-location.mjs)"
          echo "$out"
          slug="$(echo "$out" | sed -n 's/^Published //p')"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Commit and push
        if: steps.pub.outputs.slug != ''
        run: |
          git config user.name "location-publisher"
          git config user.email "location-publisher@users.noreply.github.com"
          git add content/locations
          git commit -m "Publish location page: ${{ steps.pub.outputs.slug }}"
          git push
