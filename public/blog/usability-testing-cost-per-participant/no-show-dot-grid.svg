t x="400" y="900" font-size="26" font-weight="600" fill="#6B6B70" text-anchor="middle">Each completed session carries a thin extra band</text><g class="card" data-id="text"><rect x="40.5" y="936.5" width="719" height="265" rx="20" fill="#FFE3EC" stroke="#FFE3EC"/><text x="70" y="984" font-size="26" font-weight="800" fill="#020101">Illustrative, invented inputs: 7 booked, 1</text><text x="70" y="1020" font-size="26" font-weight="800" fill="#020101">no-show, 6 completed.</text><text x="70" y="1064" font-size="26" font-weight="400" fill="#020101">The no-show's recruiting fee and the moderator</text><text x="70" y="1100" font-size="26" font-weight="400" fill="#020101">hour held for that slot are divided across the 6</text><text x="70" y="1136" font-size="26" font-weight="400" fill="#020101">completed sessions, so each one carries a sixth of</text><text x="70" y="1172" font-size="26" font-weight="400" fill="#020101">a lost slot.</text></g></svg>
