<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1588" width="800" height="1588" font-family="Manrope, system-ui, sans-serif"><rect width="800" height="1588" fill="#FBFAFB"/><path d="M58 40 H742 Q760 40 760 58 V1518 L745 1534 L730 1518 L715 1534 L700 1518 L685 1534 L670 1518 L655 1534 L640 1518 L625 1534 L610 1518 L595 1534 L580 1518 L565 1534 L550 1518 L535 1534 L520 1518 L505 1534 L490 1518 L475 1534 L460 1518 L445 1534 L430 1518 L415 1534 L400 1518 L385 1534 L370 1518 L355 1534 L340 1518 L325 1534 L310 1518 L295 1534 L280 1518 L265 1534 L250 1518 L235 1534 L220 1518 L205 1534 L190 1518 L175 1534 L160 1518 L145 1534 L130 1518 L115 1534 L100 1518 L85 1534 L70 1518 L55 1534 L40 1518 V58 Q40 40 58 40 Z" fill="#000000" fill-opacity="0.05" transform="translate(6 8)"/><path d="M58 40 H742 Q760 40 760 58 V1518 L745 1534 L730 1518 L715 1534 L700 1518 L685 1534 L670 1518 L655 1534 L640 1518 L625 1534 L610 1518 L595 1534 L580 1518 L565 1534 L550 1518 L535 1534 L520 1518 L505 1534 L490 1518 L475 1534 L460 1518 L445 1534 L430 1518 L415 1534 L400 1518 L385 1534 L370 1518 L355 1534 L340 1518 L325 1534 L310 1518 L295 1534 L280 1518 L265 1534 L250 1518 L235 1534 L220 1518 L205 1534 L190 1518 L175 1534 L160 1518 L145 1534 L130 1518 L115 1534 L100 1518 L85 1534 L70 1518 L55 1534 L40 1518 V58 Q40 40 58 40 Z" fill="#FFFFFF" stroke="#E8E8EB" stroke-width="2" stroke-linejoin="round"/><text x="400" y="110" font-size="30" font-weight="800" fill="#E2225F" text-anchor="middle" letter-spacing="6">RECEIPT</text><text x="400" y="160" font-size="30" font-weight="800" fill="#020101" text-anchor="middle">One completed 60-minute</text><text x="400" y="200" font-size="30" font-weight="800" fill="#020101" text-anchor="middle">moderated session with a general</text><text x="400" y="240" font-size="30" font-weight="800" fill="#020101" text-anchor="middle">consumer</text><path d="M72 268 H728" stroke="#020101" stroke-width="2"/><text x="72" y="308" font-size="26" font-weight="700" fill="#6B6B70">Receipt line</text><text x="728" y="308" font-size="26" font-weight="700" fill="#6B6B70" text-anchor="end">How it is priced</text><path d="M72 330 H728" stroke="#020101" stroke-width="2"/><g class="card" data-id="line1"><rect x="60" y="344" width="680" height="174" fill="none" stroke="none"/><circle cx="90" cy="382" r="17" fill="#E2225F"/><text x="90" y="391" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="112" y="391" font-size="30" font-weight="800" fill="#020101">Incentive</text><path d="M282.533203125 388 H728" stroke="#6B6B70" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><text x="112" y="430" font-size="26" font-weight="400" fill="#020101">About three in four moderated consumer</text><text x="112" y="464" font-size="26" font-weight="400" fill="#020101">sessions paid $60–$100 per hour (User</text><text x="112" y="498" font-size="26" font-weight="400" fill="#020101">Interviews)</text></g><path d="M72 518 H728" stroke="#E8E8EB" stroke-width="2" stroke-dasharray="8 6"/><g class="card" data-id="line2"><rect x="60" y="522" width="680" height="208" fill="none" stroke="none"/><circle cx="90" cy="560" r="17" fill="#E2225F"/><text x="90" y="569" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="112" y="569" font-size="30" font-weight="800" fill="#020101">Recruiting fee</text><path d="M365.3115234375 566 H728" stroke="#6B6B70" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><text x="112" y="608" font-size="26" font-weight="400" fill="#020101">Panel from about $7–$10 per general</text><text x="112" y="642" font-size="26" font-weight="400" fill="#020101">consumer (MeasuringU); agency average of</text><text x="112" y="676" font-size="26" font-weight="400" fill="#020101">$107 in Nielsen Norman Group's original</text><text x="112" y="710" font-size="26" font-weight="400" fill="#020101">survey; or staff hours for your own list</text></g><path d="M72 730 H728" stroke="#E8E8EB" stroke-width="2" stroke-dasharray="8 6"/><g class="card" data-id="line3"><rect x="60" y="734" width="680" height="174" fill="none" stroke="none"/><circle cx="90" cy="772" r="17" fill="#E2225F"/><text x="90" y="781" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="112" y="781" font-size="30" font-weight="800" fill="#020101">No-show share</text><path d="M376.751953125 778 H728" stroke="#6B6B70" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><text x="112" y="820" font-size="26" font-weight="400" fill="#020101">Each no-show's fee and held time ÷</text><text x="112" y="854" font-size="26" font-weight="400" fill="#020101">completed sessions; MeasuringU average</text><text x="112" y="888" font-size="26" font-weight="400" fill="#020101">about 8%</text></g><path d="M72 908 H728" stroke="#E8E8EB" stroke-width="2" stroke-dasharray="8 6"/><g class="card" data-id="line4"><rect x="60" y="912" width="680" height="140" fill="none" stroke="none"/><circle cx="90" cy="950" r="17" fill="#E2225F"/><text x="90" y="959" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="112" y="959" font-size="30" font-weight="800" fill="#020101">Moderator time</text><path d="M389.7451171875 956 H728" stroke="#6B6B70" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><text x="112" y="998" font-size="26" font-weight="400" fill="#020101">Your loaded rate × (setup + session + debrief</text><text x="112" y="1032" font-size="26" font-weight="400" fill="#020101">hours)</text></g><path d="M72 1052 H728" stroke="#E8E8EB" stroke-width="2" stroke-dasharray="8 6"/><g class="card" data-id="line5"><rect x="60" y="1056" width="680" height="140" fill="none" stroke="none"/><circle cx="90" cy="1094" r="17" fill="#E2225F"/><text x="90" y="1103" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="112" y="1103" font-size="30" font-weight="800" fill="#020101">Analysis time</text><path d="M353.3291015625 1100 H728" stroke="#6B6B70" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><text x="112" y="1142" font-size="26" font-weight="400" fill="#020101">Your loaded rate × (notes, clips and severity</text><text x="112" y="1176" font-size="26" font-weight="400" fill="#020101">rating hours)</text></g><path d="M72 1196 H728" stroke="#E8E8EB" stroke-width="2" stroke-dasharray="8 6"/><g class="card" data-id="line6"><rect x="60" y="1200" width="680" height="106" fill="none" stroke="none"/><circle cx="90" cy="1238" r="17" fill="#E2225F"/><text x="90" y="1247" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text><text x="112" y="1247" font-size="30" font-weight="800" fill="#020101">Tool share</text><path d="M303.01171875 1244 H728" stroke="#6B6B70" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><text x="112" y="1286" font-size="26" font-weight="400" fill="#020101">Licence cost ÷ sessions in the licence period</text></g><path d="M72 1316 H728 M72 1324 H728" stroke="#020101" stroke-width="2"/><g class="card" data-id="total"><rect x="60" y="1316" width="680" height="140" fill="none" stroke="none"/><text x="72" y="1380" font-size="36" font-weight="800" fill="#020101">Your total</text><rect x="304.5" y="1342" width="423.5" height="56" rx="10" fill="#FFFFFF" stroke="#E2225F" stroke-width="2.5" stroke-dasharray="8 6"/><text x="72" y="1436" font-size="26" font-weight="600" fill="#6B6B70">Blank, for your own numbers</text></g><rect x="250" y="1462" width="7.2" height="36" fill="#020101" fill-opacity="0.75"/><rect x="264.4" y="1462" width="4.8" height="36" fill="#020101" fill-opacity="0.75"/><rect x="276.4" y="1462" width="7.2" height="36" fill="#020101" fill-opacity="0.75"/><rect x="293.2" y="1462" width="2.4" height="36" fill="#020101" fill-opacity="0.75"/><rect x="302.8" y="1462" width="7.2" height="36" fill="#020101" fill-opacity="0.75"/><rect x="317.2" y="1462" width="4.8" height="36" fill="#020101" fill-op