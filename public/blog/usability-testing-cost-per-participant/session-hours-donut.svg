<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1498" width="800" height="1498" font-family="Manrope, system-ui, sans-serif"><rect width="800" height="1498" fill="#FBFAFB"/><text x="40" y="76" font-size="36" font-weight="800" fill="#020101">The hours behind one moderated</text><text x="40" y="122" font-size="36" font-weight="800" fill="#020101">session</text><g class="card" data-id="pill"><rect x="40.5" y="168.5" width="542.737" height="43" rx="22" fill="#FFE3EC" stroke="#FFE3EC"/><text x="311.869" y="199" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">Illustrative: segments not to scale</text></g><path d="M406.6 264.1 A190 190 0 0 1 578.5 389.0 L505.2 415.7 A112 112 0 0 0 403.9 342.1 Z" fill="#FFE3EC" stroke="#E2225F" stroke-width="2"/><circle cx="489" cy="332" r="22" fill="#E2225F"/><text x="489" y="341" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><path d="M582.6 401.6 A190 190 0 0 1 517.0 603.7 L469.0 542.3 A112 112 0 0 0 507.7 423.1 Z" fill="#E2225F" stroke="#E2225F" stroke-width="2"/><circle cx="544" cy="501" r="22" fill="#FFFFFF"/><text x="544" y="510" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">2</text><path d="M506.2 611.5 A190 190 0 0 1 293.8 611.5 L337.4 546.9 A112 112 0 0 0 462.6 546.9 Z" fill="#FFE3EC" stroke="#E2225F" stroke-width="2"/><circle cx="400" cy="605" r="22" fill="#E2225F"/><text x="400" y="614" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><path d="M283.0 603.7 A190 190 0 0 1 217.4 401.6 L292.3 423.1 A112 112 0 0 0 331.0 542.3 Z" fill="#FFE3EC" stroke="#E2225F" stroke-width="2"/><circle cx="256" cy="501" r="22" fill="#E2225F"/><text x="256" y="510" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><path d="M221.5 389.0 A190 190 0 0 1 393.4 264.1 L396.1 342.1 A112 112 0 0 0 294.8 415.7 Z" fill="#FFE3EC" stroke="#E2225F" stroke-width="2"/><circle cx="311" cy="332" r="22" fill="#E2225F"/><text x="311" y="341" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="400" y="448" font-size="28" font-weight="800" fill="#020101" text-anchor="middle">One</text><text x="400" y="482" font-size="28" font-weight="800" fill="#020101" text-anchor="middle">moderated</text><text x="400" y="516" font-size="28" font-weight="800" fill="#020101" text-anchor="middle">session</text><g class="card" data-id="d1"><rect x="40.5" y="684.5" width="719" height="151" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="84" cy="724" r="20" fill="#E2225F"/><text x="84" y="733" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="124" y="733" font-size="28" font-weight="800" fill="#020101">Setup</text><text x="124" y="774" font-size="26" font-weight="400" fill="#020101">Pilot the tasks; check the prototype link,</text><text x="124" y="808" font-size="26" font-weight="400" fill="#020101">recording and consent form.</text></g><g class="card" data-id="d2"><rect x="40.5" y="848.5" width="719" height="117" rx="20" fill="#E2225F" stroke="#E2225F"/><circle cx="84" cy="888" r="20" fill="#FFFFFF"/><text x="84" y="897" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">2</text><text x="124" y="897" font-size="28" font-weight="800" fill="#FFFFFF">Session</text><text x="124" y="938" font-size="26" font-weight="400" fill="#FFFFFF">The 45–60 minute think-aloud session.</text></g><g class="card" data-id="d3"><rect x="40.5" y="978.5" width="719" height="151" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="84" cy="1018" r="20" fill="#E2225F"/><text x="84" y="1027" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="124" y="1027" font-size="28" font-weight="800" fill="#020101">Debrief</text><text x="124" y="1068" font-size="26" font-weight="400" fill="#020101">Capture the top observations while they are</text><text x="124" y="1102" font-size="26" font-weight="400" fill="#020101">fresh.</text></g><g class="card" data-id="d4"><rect x="40.5" y="1142.5" width="719" height="151" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="84" cy="1182" r="20" fill="#E2225F"/><text x="84" y="1191" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="124" y="1191" font-size="28" font-weight="800" fill="#020101">Notes and clips</text><text x="124" y="1232" font-size="26" font-weight="400" fill="#020101">Timestamped notes and a video clip per</text><text x="124" y="1266" font-size="26" font-weight="400" fill="#020101">finding.</text></g><g class="card" data-id="d5"><rect x="40.5" y="1306.5" width="719" height="151" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="84" cy="1346" r="20" fill="#E2225F"/><text x="84" y="1355" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="124" y="1355" font-size="28" font-weight="800" fill="#020101">Severity and fix proposal</text><text x="124" y="1396" font-size="26" font-weight="400" fill="#020101">A 1–4 rating and a recommended design fix</text><text x="124" y="1430" font-size="26" font-weight="400" fill="#020101">per finding.</text></g></svg>
