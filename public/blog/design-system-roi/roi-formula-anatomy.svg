<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1078" width="800" height="1078" font-family="Manrope, system-ui, sans-serif">
<rect width="800" height="1078" rx="24" fill="#FBFAFB"/>
<defs><marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E2225F"/></marker><marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B6B70"/></marker></defs>
<text x="40" y="72" font-size="36" font-weight="800" fill="#020101">The design system ROI formula</text>
<g id="roi"><rect x="40" y="104" width="720" height="104" rx="20" fill="#FFE3EC" stroke="#FFE3EC"/><text x="400" y="170" font-size="34" font-weight="800" fill="#020101" text-anchor="middle">ROI = (gain − cost) ÷ cost × 100</text></g>
<g id="gain">
<rect x="40" y="232" width="720" height="178" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<text x="72" y="284" font-size="30" font-weight="800" fill="#E2225F">Gain =</text>
<rect x="72" y="314" width="262.4" height="64" rx="32" fill="#FFE3EC" stroke="#E2225F"/><text x="203.2" y="355" font-size="26" font-weight="700" fill="#020101" text-anchor="middle">UI hours saved</text>
<text x="366.4" y="356" font-size="34" font-weight="800" fill="#E2225F" text-anchor="middle">×</text>
<rect x="398.4" y="314" width="324.8" height="64" rx="32" fill="#FFE3EC" stroke="#E2225F"/><text x="560.8" y="355" font-size="26" font-weight="700" fill="#020101" text-anchor="middle">loaded hourly cost</text>
</g>
<g id="cost">
<rect x="40" y="434" width="720" height="342" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<text x="72" y="486" font-size="30" font-weight="800" fill="#E2225F">Cost =</text>
<rect x="104" y="512" width="118.0" height="60" rx="30" fill="#FFFFFF" stroke="#020101"/><text x="163.0" y="551" font-size="26" font-weight="700" fill="#020101" text-anchor="middle">build</text>
<text x="238.0" y="551" font-size="26" fill="#6B6B70">(agency fee + internal pairing hours)</text>
<text x="82" y="638" font-size="32" font-weight="800" fill="#E2225F" text-anchor="middle">+</text>
<rect x="104" y="596" width="133.6" height="60" rx="30" fill="#FFFFFF" stroke="#020101"/><text x="170.8" y="635" font-size="26" font-weight="700" fill="#020101" text-anchor="middle">upkeep</text>
<text x="253.6" y="635" font-size="26" fill="#6B6B70">(owner time, tooling, releases)</text>
<text x="82" y="722" font-size="32" font-weight="800" fill="#E2225F" text-anchor="middle">+</text>
<rect x="104" y="680" width="289.6" height="60" rx="30" fill="#FFFFFF" stroke="#020101"/><text x="248.8" y="719" font-size="26" font-weight="700" fill="#020101" text-anchor="middle">adoption support</text>
</g>
<g id="horizon">
<rect x="40" y="808" width="720" height="230" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<text x="72" y="860" font-size="30" font-weight="800" fill="#E2225F">Horizon = <tspan fill="#020101">3–5 years,</tspan></text>
<text x="72" y="900" font-size="26" fill="#6B6B70">until the next major revamp</text>
<rect x="461.6" y="950" width="246.4" height="36" rx="18" fill="#FFE3EC"/>
<path d="M92 968 H708" stroke="#020101" stroke-width="3"/>
<circle cx="92" cy="968" r="6" fill="#020101"/>
<text x="92" y="1020" font-size="26" fill="#6B6B70" text-anchor="middle">0</text>
<circle cx="215" cy="968" r="6" fill="#020101"/>
<text x="215" y="1020" font-size="26" fill="#6B6B70" text-anchor="middle">1</text>
<circle cx="338" cy="968" r="6" fill="#020101"/>
<text x="338" y="1020" font-size="26" fill="#6B6B70" text-anchor="middle">2</text>
<circle cx="462" cy="968" r="9" fill="#E2225F"/>
<text x="462" y="1020" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">3</text>
<circle cx="585" cy="968" r="9" fill="#E2225F"/>
<text x="585" y="1020" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">4</text>
<circle cx="708" cy="968" r="9" fill="#E2225F"/>
<text x="708" y="1020" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">5</text>
</g>
</svg>
