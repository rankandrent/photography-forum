<rect x="430" y="642" width="330" height="80" rx="20" fill="#FFFFFF" stroke="#6B6B70" stroke-dasharray="8 6"/>
<text x="454" y="686" font-size="26" font-weight="700" fill="#020101">no system</text>
<path d="M205 578 V754" stroke="#E2225F" stroke-width="3" marker-end="url(#ap)"/>
<text x="219" y="618" font-size="26" font-weight="800" fill="#E2225F">No</text>
</g>
