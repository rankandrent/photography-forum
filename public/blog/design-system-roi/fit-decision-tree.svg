<text x="64" y="346" font-size="26" font-weight="700" fill="#020101">UI kit + design</text>
<text x="64" y="380" font-size="26" font-weight="700" fill="#020101">tokens</text>
<path d="M595 238 V448" stroke="#E2225F" stroke-width="3" marker-end="url(#ap)"/>
<text x="609" y="278" font-size="26" font-weight="800" fill="#E2225F">Yes</text>
</g>
