<circle cx="104" cy="515.0" r="26" fill="#020101"/><text x="104" y="525" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="150" y="504" font-size="28" font-weight="800" fill="#020101">Product being sunset within your</text>
<text x="150" y="542" font-size="28" font-weight="800" fill="#020101">horizon?</text>
