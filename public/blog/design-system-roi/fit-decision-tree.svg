<rect x="40" y="948" width="330" height="148" rx="20" fill="#FFFFFF" stroke="#6B6B70" stroke-dasharray="8 6"/>
<text x="64" y="992" font-size="26" font-weight="700" fill="#020101">wait 2 quarters</text>
<text x="64" y="1026" font-size="26" font-weight="700" fill="#020101">and tokenize with</text>
<text x="64" y="1060" font-size="26" font-weight="700" fill="#020101">the rebrand</text>
<path d="M595 884 V1128" stroke="#E2225F" stroke-width="3" marker-end="url(#ap)"/>
<text x="609" y="924" font-size="26" font-weight="800" fill="#E2225F">No</text>
