<rect x="40" y="1132" width="10" height="126" rx="5" fill="#E2225F"/>
<circle cx="104" cy="1195.0" r="26" fill="#020101"/><text x="104" y="1205" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="150" y="1184" font-size="28" font-weight="800" fill="#020101">An engineer will own the coded</text>
