<path d="M595 1258 V1318" stroke="#6B6B70" stroke-width="3" marker-end="url(#am)"/>
<text x="609" y="1298" font-size="26" font-weight="800" fill="#6B6B70">No</text>
<rect x="430" y="1322" width="330" height="114" rx="20" fill="#FFFFFF" stroke="#6B6B70" stroke-dasharray="8 6"/>
<text x="454" y="1366" font-size="26" font-weight="700" fill="#020101">wait until</text>
<text x="454" y="1400" font-size="26" font-weight="700" fill="#020101">someone can</text>
