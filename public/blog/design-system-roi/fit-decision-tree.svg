<text x="219" y="1298" font-size="26" font-weight="800" fill="#E2225F">Yes</text>
<rect x="40" y="1322" width="330" height="114" rx="20" fill="#E2225F" stroke="#E2225F"/>
<text x="205" y="1390.0" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">design system now</text>
