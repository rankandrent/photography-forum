<circle cx="104" cy="175.0" r="26" fill="#020101"/><text x="104" y="185" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="150" y="164" font-size="28" font-weight="800" fill="#020101">2 or more teams on the same</text>
<text x="150" y="202" font-size="28" font-weight="800" fill="#020101">product?</text>
