<circle cx="104" cy="821.0" r="26" fill="#020101"/><text x="104" y="831" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="150" y="810" font-size="28" font-weight="800" fill="#020101">Rebrand planned with no time to</text>
