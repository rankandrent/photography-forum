<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1710" width="800" height="1710" font-family="Manrope, system-ui, sans-serif">
<rect width="800" height="1710" fill="#FBFAFB"/>
<text x="40" y="72" font-size="38" font-weight="800" fill="#020101">Hybrid UX audit: who does what</text>
<text x="40" y="114" font-size="28" font-weight="600" fill="#6B6B70">Each step hands a package to the next</text>
<rect x="120.5" y="160.5" width="639" height="222" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<circle cx="70" cy="204" r="30" fill="#E2225F"/>
<text x="70" y="214" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="150" y="212" font-size="30" font-weight="800" fill="#020101">AI pre-scan</text>
<text x="150" y="258" font-size="26" font-weight="500" fill="#020101"><tspan font-weight="800" fill="#6B6B70">Owner:</tspan> a designer or product manager</text>
<text x="150" y="292" font-size="26" font-weight="500" fill="#020101">runs an AI tool and an automated</text>
<text x="150" y="326" font-size="26" font-weight="500" fill="#020101">accessibility checker.</text>
<path d="M70 234 V516" stroke="#E2225F" stroke-width="3" stroke-dasharray="0"/>
<rect x="150" y="402" width="560" height="90" rx="16" fill="#FFE3EC"/>
<path d="M110 447.0 H150" stroke="#E2225F" stroke-width="3"/>
<path d="M100 437.0 l10 10 l-10 10" fill="none" stroke="#E2225F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="440" font-size="26" font-weight="800" fill="#E2225F">Hands off:</text>
<text x="176" y="474" font-size="26" font-weight="700" fill="#020101">candidate issues to verify.</text>
<rect x="120.5" y="516.5" width="639" height="222" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<circle cx="70" cy="560" r="30" fill="#E2225F"/>
<text x="70" y="570" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="150" y="568" font-size="30" font-weight="800" fill="#020101">Internal triage</text>
<text x="150" y="614" font-size="26" font-weight="500" fill="#020101"><tspan font-weight="800" fill="#6B6B70">Owner:</tspan> reviewers from another squad</text>
<text x="150" y="648" font-size="26" font-weight="500" fill="#020101">confirm or drop each candidate and fix</text>
<text x="150" y="682" font-size="26" font-weight="500" fill="#020101">the obvious.</text>
<path d="M70 590 V906" stroke="#E2225F" stroke-width="3" stroke-dasharray="0"/>
<rect x="150" y="758" width="560" height="124" rx="16" fill="#FFE3EC"/>
<path d="M110 820.0 H150" stroke="#E2225F" stroke-width="3"/>
<path d="M100 810.0 l10 10 l-10 10" fill="none" stroke="#E2225F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="796" font-size="26" font-weight="800" fill="#E2225F">Hands off:</text>
<text x="176" y="830" font-size="26" font-weight="700" fill="#020101">fixes made, plus top flows</text>
<text x="176" y="864" font-size="26" font-weight="700" fill="#020101">ranked by revenue or risk.</text>
<rect x="120.5" y="906.5" width="639" height="154" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<circle cx="70" cy="950" r="30" fill="#E2225F"/>
<text x="70" y="960" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="150" y="958" font-size="30" font-weight="800" fill="#020101">Expert audit of top flows</text>
<text x="150" y="1004" font-size="26" font-weight="500" fill="#020101"><tspan font-weight="800" fill="#6B6B70">Owner:</tspan> the agency or freelancer.</text>
<path d="M70 980 V1228" stroke="#E2225F" stroke-width="3" stroke-dasharray="0"/>
<rect x="150" y="1080" width="560" height="124" rx="16" fill="#FFE3EC"/>
<path d="M110 1142.0 H150" stroke="#E2225F" stroke-width="3"/>
<path d="M100 1132.0 l10 10 l-10 10" fill="none" stroke="#E2225F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="1118" font-size="26" font-weight="800" fill="#E2225F">Hands off:</text>
<text x="176" y="1152" font-size="26" font-weight="700" fill="#020101">a UX audit report and</text>
<text x="176" y="1186" font-size="26" font-weight="700" fill="#020101">prioritized fix roadmap.</text>
<rect x="120.5" y="1228.5" width="639" height="194" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<circle cx="70" cy="1272" r="30" fill="#E2225F"/>
<text x="70" y="1282" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="150" y="1280" font-size="30" font-weight="800" fill="#020101">Usability test of the riskiest</text>
<text x="150" y="1320" font-size="30" font-weight="800" fill="#020101">flow</text>
<text x="150" y="1366" font-size="26" font-weight="500" fill="#020101"><tspan font-weight="800" fill="#6B6B70">Owner:</tspan> a research team or partner.</text>
<path d="M70 1302 V1590" stroke="#E2225F" stroke-width="3" stroke-dasharray="7 6"/>
<rect x="150" y="1442" width="560" height="124" rx="16" fill="#FFE3EC"/>
<path d="M110 1504.0 H150" stroke="#E2225F" stroke-width="3"/>
<path d="M100 1494.0 l10 10 l-10 10" fill="none" stroke="#E2225F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="176" y="1480" font-size="26" font-weight="800" fill="#E2225F">Hands off:</text>
<text x="176" y="1514" font-size="26" font-weight="700" fill="#020101">observed failures that confirm</text>
<text x="176" y="1548" font-size="26" font-weight="700" fill="#020101">or reorder the roadmap.</text>
<path d="M58 1580 l12 14 l12 -14" fill="none" stroke="#E2225F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="1600" font-size="26" font-weight="700" fill="#020101">Never hand AI output to the auditor</text>
<text x="120" y="1636" font-size="26" font-weight="700" fill="#020101">as findings; hand it over as a list</text>
<text x="120" y="1672" font-size="26" font-weight="700" fill="#020101">to verify.</text>
</svg>
