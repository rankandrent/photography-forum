<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 2280" width="800" height="2280" font-family="Manrope, system-ui, sans-serif">
<rect width="800" height="2280" fill="#FBFAFB"/>
<rect x="40" y="36" width="344" height="46" rx="23" fill="#FFE3EC"/>
<text x="212" y="68" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">Illustrative example</text>
<text x="40" y="130" font-size="40" font-weight="800" fill="#020101">One checkout issue,</text>
<text x="40" y="176" font-size="40" font-weight="800" fill="#020101">written four ways</text>
<rect x="40.5" y="210.5" width="719" height="250" rx="24" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="74" y="238" width="120" height="196" rx="18" fill="none" stroke="#020101" stroke-width="3"/>
<rect x="90" y="268" width="88" height="20" rx="5" fill="none" stroke="#6B6B70" stroke-width="2"/>
<rect x="90" y="298" width="88" height="20" rx="5" fill="none" stroke="#E2225F" stroke-width="3"/>
<rect x="80" y="348" width="108" height="60" rx="4" fill="#FFE3EC"/>
<path d="M90 362 h88 M90 378 h88 M90 394 h60" stroke="#6B6B70" stroke-width="2"/>
<rect x="90" y="330" width="88" height="14" rx="5" fill="#020101"/>
<path d="M194 308 q40 0 40 150" fill="none" stroke="#E2225F" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="234" cy="460" r="6" fill="#E2225F"/>
<text x="250" y="280" font-size="28" font-weight="700" fill="#020101">On mobile, an invalid ZIP</text>
<text x="250" y="320" font-size="28" font-weight="700" fill="#020101">code error appears</text>
<text x="250" y="360" font-size="28" font-weight="700" fill="#020101">off-screen and the Pay</text>
<text x="250" y="400" font-size="28" font-weight="700" fill="#020101">button does nothing.</text>
<rect x="40.5" y="500.5" width="719" height="386" rx="20" fill="#FFFFFF" stroke="#E8E8EB" stroke-width="1"/>
<text x="72" y="552" font-size="30" font-weight="800" fill="#020101">AI tool</text>
<text x="72" y="596" font-size="26" font-weight="500" fill="#3A3A3F">“Improve error messaging for a better user</text>
<text x="72" y="632" font-size="26" font-weight="500" fill="#3A3A3F">experience.”</text>
<path d="M72 682 H728" stroke="#E8E8EB" stroke-width="2"/>
<text x="72" y="728" font-size="26" font-weight="800" fill="#E2225F">Missing:</text>
<rect x="73" y="747" width="178" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="162.0" y="777" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">evidence</text>
<rect x="265" y="747" width="178" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="354.0" y="777" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">location</text>
<rect x="457" y="747" width="178" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="546.0" y="777" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">severity</text>
<rect x="73" y="801" width="93" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="119.5" y="831" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">fix</text>
<rect x="180" y="801" width="144" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="252.0" y="831" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">effort</text>
<rect x="40.5" y="908.5" width="719" height="296" rx="20" fill="#FFFFFF" stroke="#E8E8EB" stroke-width="1"/>
<text x="72" y="960" font-size="30" font-weight="800" fill="#020101">In-house note</text>
<text x="72" y="1004" font-size="26" font-weight="500" fill="#3A3A3F">“ZIP error hard to see on mobile, fix?”</text>
<path d="M72 1054 H728" stroke="#E8E8EB" stroke-width="2"/>
<text x="72" y="1100" font-size="26" font-weight="800" fill="#E2225F">Missing:</text>
<rect x="73" y="1119" width="195" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="170.5" y="1149" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">heuristic</text>
<rect x="282" y="1119" width="178" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="371.0" y="1149" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">severity</text>
<rect x="474" y="1119" width="144" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="546.0" y="1149" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">effort</text>
<rect x="40.5" y="1226.5" width="719" height="404" rx="20" fill="#FFFFFF" stroke="#E8E8EB" stroke-width="1"/>
<text x="72" y="1278" font-size="30" font-weight="800" fill="#020101">Freelancer</text>
<text x="72" y="1322" font-size="26" font-weight="500" fill="#3A3A3F">“Heuristic 9 (help users recognize,</text>
<text x="72" y="1358" font-size="26" font-weight="500" fill="#3A3A3F">diagnose and recover from errors): ZIP</text>
<text x="72" y="1394" font-size="26" font-weight="500" fill="#3A3A3F">error renders off-screen on mobile; move</text>
<text x="72" y="1430" font-size="26" font-weight="500" fill="#3A3A3F">it inline. Screenshot attached.”</text>
<path d="M72 1480 H728" stroke="#E8E8EB" stroke-width="2"/>
<text x="72" y="1526" font-size="26" font-weight="800" fill="#E2225F">Missing:</text>
<rect x="73" y="1545" width="178" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="162.0" y="1575" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">severity</text>
<rect x="265" y="1545" width="144" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="337.0" y="1575" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">effort</text>
<rect x="423" y="1545" width="110" height="42" rx="21" fill="#FFFFFF" stroke="#E2225F" stroke-width="2" stroke-dasharray="6 5"/>
<text x="478.0" y="1575" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">data</text>
<rect x="40.5" y="1652.5" width="719" height="546" rx="20" fill="#FFFFFF" stroke="#E2225F" stroke-width="3"/>
<text x="72" y="1704" font-size="30" font-weight="800" fill="#020101">Agency report</text>
<circle cx="82" cy="1739" r="6" fill="#E2225F"/>
<text x="100" y="1748" font-size="26" font-weight="500" fill="#020101">screenshot;</text>
<circle cx="82" cy="1775" r="6" fill="#E2225F"/>
<text x="100" y="1784" font-size="26" font-weight="500" fill="#020101">heuristics 1 (visibility of system status)</text>
<text x="100" y="1820" font-size="26" font-weight="500" fill="#020101">and 9;</text>
<circle cx="82" cy="1847" r="6" fill="#E2225F"/>
<text x="100" y="1856" font-size="26" font-weight="500" fill="#020101">WCAG 3.3.1 Error Identification;</text>
<circle cx="82" cy="1883" r="6" fill="#E2225F"/>
<text x="100" y="1892" font-size="26" font-weight="500" fill="#020101">payment-step drop-off and dead clicks on</text>
<text x="100" y="1928" font-size="26" font-weight="500" fill="#020101">Pay;</text>
<circle cx="82" cy="1955" r="6" fill="#E2225F"/>
<text x="100" y="1964" font-size="26" font-weight="500" fill="#020101">severity 3 of 4;</text>
<circle cx="82" cy="1991" r="6" fill="#E2225F"/>
<text x="100" y="2000" font-size="26" font-weight="500" fill="#020101">inline error with focus moved to the</text>
<text x="100" y="2036" font-size="26" font-weight="500" fill="#020101">field;</text>
<circle cx="82" cy="2063" r="6" fill="#E2225F"/>
<text x="100" y="2072" font-size="26" font-weight="500" fill="#020101">effort in development days.</text>
<path d="M72 2122 H728" stroke="#E8E8EB" stroke-width="2"/>
<rect x="72" y="2140" width="330" height="46" rx="23" fill="#FFE3EC"/>
<path d="M92 2163 l8 9 l15 -17" fill="none" stroke="#E2225F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="128" y="2172" font-size="26" font-weight="800" fill="#E2225F">Missing: nothing.</text>
<text x="40" y="2250" font-size="26" font-weight="600" fill="#6B6B70">Not a client finding.</text>
</svg>
