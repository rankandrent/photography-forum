<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1302" width="800" height="1302" font-family="Manrope, system-ui, sans-serif">
<rect width="800" height="1302" fill="#FBFAFB"/>
<rect x="56" y="52" width="704" height="1210" rx="24" fill="#E8E8EB"/>
<rect x="40.5" y="40.5" width="719" height="1210" rx="24" fill="#FFFFFF" stroke="#E8E8EB"/>
<path d="M40 64 a24 24 0 0 1 24 -24 H736 a24 24 0 0 1 24 24 V190 H40 Z" fill="#020101"/>
<text x="96" y="114" font-size="40" font-weight="800" fill="#FFFFFF">UX audit scope sheet</text>
<text x="96" y="158" font-size="28" font-weight="600" fill="#FFFFFF" fill-opacity="0.75">6 inputs for a comparable quote</text>
<rect x="640" y="90" width="80" height="54" rx="10" fill="none" stroke="#E2225F" stroke-width="3"/>
<path d="M640 96 l40 26 l40 -26" fill="none" stroke="#E2225F" stroke-width="3" stroke-linejoin="round"/>
<text x="60" y="262" font-size="28" font-weight="800" fill="#E2225F">1</text>
<text x="96" y="262" font-size="28" font-weight="800" fill="#020101">Flows</text>
<rect x="97" y="280" width="606" height="102" rx="12" fill="#FBFAFB" stroke="#C9C9CF" stroke-width="2" stroke-dasharray="8 6"/>
<text x="118" y="320" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">the key journeys, for example sign-up,</text>
<text x="118" y="354" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">onboarding and checkout.</text>
<text x="60" y="434" font-size="28" font-weight="800" fill="#E2225F">2</text>
<text x="96" y="434" font-size="28" font-weight="800" fill="#020101">Platforms</text>
<rect x="97" y="452" width="606" height="68" rx="12" fill="#FBFAFB" stroke="#C9C9CF" stroke-width="2" stroke-dasharray="8 6"/>
<text x="118" y="492" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">web, iOS, Android, or a mix.</text>
<text x="60" y="572" font-size="28" font-weight="800" fill="#E2225F">3</text>
<text x="96" y="572" font-size="28" font-weight="800" fill="#020101">User roles</text>
<rect x="97" y="590" width="606" height="102" rx="12" fill="#FBFAFB" stroke="#C9C9CF" stroke-width="2" stroke-dasharray="8 6"/>
<text x="118" y="630" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">for example shopper and guest, or</text>
<text x="118" y="664" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">admin and end user.</text>
<text x="60" y="744" font-size="28" font-weight="800" fill="#E2225F">4</text>
<text x="96" y="744" font-size="28" font-weight="800" fill="#020101">Analytics access</text>
<rect x="97" y="762" width="606" height="102" rx="12" fill="#FBFAFB" stroke="#C9C9CF" stroke-width="2" stroke-dasharray="8 6"/>
<text x="118" y="802" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">Google Analytics 4, Hotjar, Microsoft</text>
<text x="118" y="836" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">Clarity, or none.</text>
<text x="60" y="916" font-size="28" font-weight="800" fill="#E2225F">5</text>
<text x="96" y="916" font-size="28" font-weight="800" fill="#020101">Accessibility target</text>
<rect x="97" y="934" width="606" height="102" rx="12" fill="#FBFAFB" stroke="#C9C9CF" stroke-width="2" stroke-dasharray="8 6"/>
<text x="118" y="974" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">WCAG 2.2 AA on audited screens, or a</text>
<text x="118" y="1008" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">full-site review.</text>
<text x="60" y="1088" font-size="28" font-weight="800" fill="#E2225F">6</text>
<text x="96" y="1088" font-size="28" font-weight="800" fill="#020101">Decision deadline</text>
<rect x="97" y="1106" width="606" height="102" rx="12" fill="#FBFAFB" stroke="#C9C9CF" stroke-width="2" stroke-dasharray="8 6"/>
<text x="118" y="1146" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">the date the findings must inform,</text>
<text x="118" y="1180" font-size="26" font-weight="500" fill="#6B6B70" font-style="italic">such as a redesign approval.</text>
</svg>
