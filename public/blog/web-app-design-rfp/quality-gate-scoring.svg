<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" font-family="Manrope, system-ui, sans-serif">
<rect width="800" height="1000" rx="24" fill="#FBFAFB"/>
<text x="40" y="76" font-size="36" font-weight="800" fill="#020101">Score quality before opening price</text>
<rect x="40" y="98" width="720" height="44" rx="22" fill="#FFE3EC"/>
<text x="400" y="129" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">Suggested example weights, not a standard</text>
<g class="card"><rect x="160" y="176" width="600" height="342" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<text x="176" y="234" font-size="30" font-weight="800" fill="#020101">Quality (100 points):</text>
<rect x="176" y="262" width="22" height="22" rx="6" fill="#E2225F"/>
<text x="212" y="282" font-size="26" fill="#020101">workflow understanding 30</text>
<rect x="176" y="304" width="22" height="22" rx="6" fill="#EC5A88"/>
<text x="212" y="324" font-size="26" fill="#020101">research and test plan 25</text>
<rect x="176" y="346" width="22" height="22" rx="6" fill="#F38FAF"/>
<text x="212" y="366" font-size="26" fill="#020101">case evidence 25</text>
<rect x="176" y="388" width="22" height="22" rx="6" fill="#F9C3D4"/>
<text x="212" y="408" font-size="26" fill="#020101">team seniority and continuity 20</text>
<rect x="176" y="434" width="164" height="56" rx="10" fill="#E2225F"/>
<text x="258" y="472" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">30</text>
<rect x="344" y="434" width="136" height="56" rx="10" fill="#EC5A88"/>
<text x="412" y="472" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">25</text>
<rect x="484" y="434" width="136" height="56" rx="10" fill="#F38FAF"/>
<text x="552" y="472" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">25</text>
<rect x="624" y="434" width="108" height="56" rx="10" fill="#F9C3D4"/>
<text x="678" y="472" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">20</text>
</g>
<path d="M40 176 H152 L140 518 H52 Z" fill="#FFE3EC" stroke="#E2225F" stroke-width="2" stroke-linejoin="round"/>
<circle cx="96" cy="347.0" r="22" fill="#E2225F"/><text x="96" y="356" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<g class="card"><rect x="160" y="542" width="600" height="222" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<text x="176" y="600" font-size="30" font-weight="800" fill="#020101">Gate:</text>
<text x="176" y="636" font-size="26" fill="#020101">proposals scoring 70 or more move on.</text>
<rect x="176" y="666" width="560" height="28" rx="14" fill="#EDEDF0"/>
<rect x="568" y="666" width="168" height="28" rx="14" fill="#E2225F"/>
<path d="M568 654 V706" stroke="#020101" stroke-width="3"/>
<text x="176" y="738" font-size="26" fill="#6B6B70">0</text>
<text x="568" y="738" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">70</text>
<text x="736" y="738" font-size="26" fill="#6B6B70" text-anchor="end">100</text>
</g>
<path d="M52 542 H140 L128 764 H64 Z" fill="#FFE3EC" stroke="#E2225F" stroke-width="2" stroke-linejoin="round"/>
<circle cx="96" cy="653.0" r="22" fill="#E2225F"/><text x="96" y="662" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<g class="card"><rect x="160" y="788" width="600" height="172" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<text x="176" y="846" font-size="30" font-weight="800" fill="#020101">Final score:</text>
<rect x="176" y="872" width="388" height="60" rx="12" fill="#E2225F"/>
<text x="370" y="912" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">quality 70%</text>
<rect x="568" y="872" width="164" height="60" rx="12" fill="#FFFFFF" stroke="#E2225F" stroke-width="2"/>
<text x="650" y="912" font-size="26" fill="#020101" text-anchor="middle">price 30%</text>
</g>
<path d="M64 788 H128 L116 960 H76 Z" fill="#E2225F" stroke="#E2225F" stroke-width="2" stroke-linejoin="round"/>
<circle cx="96" cy="874.0" r="22" fill="#FFFFFF"/><text x="96" y="883" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">3</text>
