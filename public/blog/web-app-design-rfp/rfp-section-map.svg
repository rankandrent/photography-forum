<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1597" width="800" height="1597" font-family="Manrope, system-ui, sans-serif">
<defs><pattern id="bp" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#F1EEF0" stroke-width="1"/></pattern></defs><rect width="800" height="1597" rx="24" fill="#FBFAFB"/><rect width="800" height="1597" rx="24" fill="url(#bp)"/>
<text x="28" y="62" font-size="36" font-weight="800" fill="#020101">9 sections agencies can price</text>
<g class="card"><rect x="28" y="84" width="333" height="44" rx="22" fill="#FFE3EC"/><text x="194.726" y="115" font-size="26" font-weight="700" fill="#E2225F" text-anchor="middle">Illustrative example</text></g>
<text x="377.452" y="115" font-size="26" fill="#6B6B70">Sample lines describe a</text>
<text x="28" y="151" font-size="26" fill="#6B6B70">made-up business-to-business (B2B) customer portal.</text>
<g class="card"><rect x="20" y="177" width="374" height="294" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="20" y="197" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="36" y="223" font-size="26" font-weight="800" fill="#E2225F">1.</text>
<text x="72.9678" y="223" font-size="26" font-weight="800" fill="#020101">Context</text>
<text x="36" y="257" font-size="26" fill="#020101">Product, current state,</text>
<text x="36" y="287" font-size="26" fill="#020101">why now</text>
<rect x="36" y="302" width="5" height="54" rx="2.5" fill="#E2225F"/>
<text x="52" y="325" font-size="26" font-weight="700" fill="#E2225F">Sets how much</text>
<text x="52" y="355" font-size="26" font-weight="700" fill="#E2225F">discovery is needed</text>
<text x="36" y="393" font-size="26" fill="#6B6B70" font-style="italic">&quot;Our 2019 distributor</text>
<text x="36" y="423" font-size="26" fill="#6B6B70" font-style="italic">portal cannot handle</text>
<text x="36" y="453" font-size="26" fill="#6B6B70" font-style="italic">approval rules.&quot;</text>
</g>
<g class="card"><rect x="20" y="483" width="374" height="264" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="20" y="503" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="36" y="529" font-size="26" font-weight="800" fill="#E2225F">2.</text>
<text x="72.9678" y="529" font-size="26" font-weight="800" fill="#020101">Goals</text>
<text x="36" y="563" font-size="26" fill="#020101">Outcomes, one metric</text>
<text x="36" y="593" font-size="26" fill="#020101">each</text>
<rect x="36" y="608" width="5" height="54" rx="2.5" fill="#E2225F"/>
<text x="52" y="631" font-size="26" font-weight="700" fill="#E2225F">Decides what gets</text>
<text x="52" y="661" font-size="26" font-weight="700" fill="#E2225F">tested</text>
<text x="36" y="699" font-size="26" fill="#6B6B70" font-style="italic">&quot;Cut time to approve an</text>
<text x="36" y="729" font-size="26" fill="#6B6B70" font-style="italic">order.&quot;</text>
</g>
<g class="card"><rect x="20" y="759" width="374" height="234" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="20" y="779" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="36" y="805" font-size="26" font-weight="800" fill="#E2225F">3.</text>
<text x="72.9678" y="805" font-size="26" font-weight="800" fill="#020101">Users and roles</text>
<text x="36" y="839" font-size="26" fill="#020101">Every role and its</text>
<text x="36" y="869" font-size="26" fill="#020101">permissions</text>
<rect x="36" y="884" width="5" height="24" rx="2.5" fill="#E2225F"/>
<text x="52" y="907" font-size="26" font-weight="700" fill="#E2225F">Each role adds views</text>
<text x="36" y="945" font-size="26" fill="#6B6B70" font-style="italic">&quot;Account admin, buyer,</text>
<text x="36" y="975" font-size="26" fill="#6B6B70" font-style="italic">approver, support agent.&quot;</text>
</g>
<g class="card"><rect x="20" y="1005" width="374" height="264" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="20" y="1025" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="36" y="1051" font-size="26" font-weight="800" fill="#E2225F">4.</text>
<text x="72.9678" y="1051" font-size="26" font-weight="800" fill="#020101">Workflow inventory</text>
<text x="36" y="1085" font-size="26" fill="#020101">Every workflow, tagged</text>
<text x="36" y="1115" font-size="26" fill="#020101">in, out or later</text>
<rect x="36" y="1130" width="5" height="54" rx="2.5" fill="#E2225F"/>
<text x="52" y="1153" font-size="26" font-weight="700" fill="#E2225F">Sets wireframe and</text>
<text x="52" y="1183" font-size="26" font-weight="700" fill="#E2225F">prototype effort</text>
<text x="36" y="1221" font-size="26" fill="#6B6B70" font-style="italic">&quot;Nine workflows, seven in</text>
<text x="36" y="1251" font-size="26" fill="#6B6B70" font-style="italic">scope.&quot;</text>
</g>
<g class="card"><rect x="20" y="1281" width="374" height="296" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="20" y="1301" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="36" y="1327" font-size="26" font-weight="800" fill="#E2225F">5.</text>
<text x="72.9678" y="1327" font-size="26" font-weight="800" fill="#020101">Screen states and</text>
<text x="72.9678" y="1359" font-size="26" font-weight="800" fill="#020101">data</text>
<text x="36" y="1393" font-size="26" fill="#020101">States, row counts,</text>
<text x="36" y="1423" font-size="26" fill="#020101">sample file</text>
<rect x="36" y="1438" width="5" height="54" rx="2.5" fill="#E2225F"/>
<text x="52" y="1461" font-size="26" font-weight="700" fill="#E2225F">States multiply</text>
<text x="52" y="1491" font-size="26" font-weight="700" fill="#E2225F">screens</text>
<text x="36" y="1529" font-size="26" fill="#6B6B70" font-style="italic">&quot;Orders: 40 rows typical,</text>
<text x="36" y="1559" font-size="26" fill="#6B6B70" font-style="italic">5,000 worst case.&quot;</text>
</g>
<g class="card"><rect x="406" y="177" width="374" height="166" rx="18" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="422" y="198" width="5" height="26" rx="2.5" fill="#020101"/>
<text x="438" y="217" font-size="26" fill="#020101">What to write</text>
<rect x="422" y="234" width="5" height="56" rx="2.5" fill="#E2225F"/>
<text x="438" y="253" font-size="26" font-weight="700" fill="#E2225F">Why it changes the</text>
<text x="438" y="283" font-size="26" font-weight="700" fill="#E2225F">price</text>
<rect x="422" y="300" width="5" height="26" rx="2.5" fill="#6B6B70"/>
<text x="438" y="319" font-size="26" fill="#6B6B70" font-style="italic">Sample line</text>
</g>
<g class="card"><rect x="406" y="355" width="374" height="264" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="406" y="375" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="422" y="401" font-size="26" font-weight="800" fill="#E2225F">6.</text>
<text x="458.968" y="401" font-size="26" font-weight="800" fill="#020101">Research access</text>
<text x="422" y="435" font-size="26" fill="#020101">Users per role, recruiter,</text>
<text x="422" y="465" font-size="26" fill="#020101">test rounds</text>
<rect x="422" y="480" width="5" height="54" rx="2.5" fill="#E2225F"/>
<text x="438" y="503" font-size="26" font-weight="700" fill="#E2225F">Sets the research</text>
<text x="438" y="533" font-size="26" font-weight="700" fill="#E2225F">timeline</text>
<text x="422" y="571" font-size="26" fill="#6B6B70" font-style="italic">&quot;We recruit six users per</text>
<text x="422" y="601" font-size="26" fill="#6B6B70" font-style="italic">role; two test rounds.&quot;</text>
</g>
<g class="card"><rect x="406" y="631" width="374" height="296" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="406" y="651" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="422" y="677" font-size="26" font-weight="800" fill="#E2225F">7.</text>
<text x="458.968" y="677" font-size="26" font-weight="800" fill="#020101">Requirements and</text>
<text x="458.968" y="709" font-size="26" font-weight="800" fill="#020101">handoff</text>
<text x="422" y="743" font-size="26" fill="#020101">Accessibility standard,</text>
<text x="422" y="773" font-size="26" fill="#020101">breakpoints, files</text>
<rect x="422" y="788" width="5" height="24" rx="2.5" fill="#E2225F"/>
<text x="438" y="811" font-size="26" font-weight="700" fill="#E2225F">Defines &quot;done&quot;</text>
<text x="422" y="849" font-size="26" fill="#6B6B70" font-style="italic">&quot;Web Content</text>
<text x="422" y="879" font-size="26" fill="#6B6B70" font-style="italic">Accessibility Guidelines</text>
<text x="422" y="909" font-size="26" fill="#6B6B70" font-style="italic">(WCAG) 2.2 level AA.&quot;</text>
</g>
<g class="card"><rect x="406" y="939" width="374" height="294" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="406" y="959" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="422" y="985" font-size="26" font-weight="800" fill="#E2225F">8.</text>
<text x="458.968" y="985" font-size="26" font-weight="800" fill="#020101">Budget and timeline</text>
<text x="422" y="1019" font-size="26" fill="#020101">Budget band, decision</text>
<text x="422" y="1049" font-size="26" fill="#020101">and start dates</text>
<rect x="422" y="1064" width="5" height="54" rx="2.5" fill="#E2225F"/>
<text x="438" y="1087" font-size="26" font-weight="700" fill="#E2225F">Agencies scope to</text>
<text x="438" y="1117" font-size="26" font-weight="700" fill="#E2225F">your number</text>
<text x="422" y="1155" font-size="26" fill="#6B6B70" font-style="italic">&quot;Band of</text>
<text x="422" y="1185" font-size="26" fill="#6B6B70" font-style="italic">$90,000–$130,000;</text>
<text x="422" y="1215" font-size="26" fill="#6B6B70" font-style="italic">decision by January 15.&quot;</text>
</g>
<g class="card"><rect x="406" y="1245" width="374" height="326" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/>
<rect x="406" y="1265" width="5" height="28" rx="2.5" fill="#E2225F"/>
<text x="422" y="1291" font-size="26" font-weight="800" fill="#E2225F">9.</text>
<text x="458.968" y="1291" font-size="26" font-weight="800" fill="#020101">Proposal format and</text>
<text x="458.968" y="1323" font-size="26" font-weight="800" fill="#020101">evaluation</text>
<text x="422" y="1357" font-size="26" fill="#020101">Page limit,</text>
<text x="422" y="1387" font-size="26" fill="#020101">question-and-answer</text>
<text x="422" y="1417" font-size="26" fill="#020101">(Q&amp;A) window, weights</text>
<rect x="422" y="1432" width="5" height="54" rx="2.5" fill="#E2225F"/>
<text x="438" y="1455" font-size="26" font-weight="700" fill="#E2225F">Bidders write to your</text>
<text x="438" y="1485" font-size="26" font-weight="700" fill="#E2225F">scoring sheet</text>
<text x="422" y="1523" font-size="26" fill="#6B6B70" font-style="italic">&quot;Proposals: twelve pages</text>
<text x="422" y="1553" font-size="26" fill="#6B6B70" font-style="italic">maximum.&quot;</text>
</g>
</svg>
