<rect x="965" y="718" width="110" height="40" rx="10" fill="#FFFFFF" stroke="#E2225F" stroke-width="2"/>
<text x="60" y="826" font-size="16" fill="#6B6B70">The weights are our suggestion; adjust them to your decision.</text>
<text x="60" y="856" font-size="16" fill="#6B6B70">Shortlist three: three proposals give you a real comparison on the scorecard.</text>
