<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1378" width="800" height="1378" font-family="Manrope, system-ui, sans-serif"><rect width="800" height="1378" fill="#FBFAFB"/><text x="40" y="76" font-size="40" font-weight="800" fill="#020101">Freelancer or agency?</text><text x="40" y="124" font-size="28" font-weight="600" fill="#6B6B70">Four yes/no questions</text><g class="card" data-id="q1"><rect x="80.5" y="194.5" width="339" height="177" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="108" y="241" font-size="26" font-weight="700" fill="#020101">Does a launch date</text><text x="108" y="275" font-size="26" font-weight="700" fill="#020101">other teams</text><text x="108" y="309" font-size="26" font-weight="700" fill="#020101">depend on fix the</text><text x="108" y="343" font-size="26" font-weight="700" fill="#020101">schedule?</text></g><circle cx="80" cy="194" r="20" fill="#E2225F"/><text x="80" y="203" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><g class="card" data-id="o0"><rect x="520.5" y="251.5" width="239" height="63" rx="32" fill="#E2225F" stroke="#E2225F"/><text x="640" y="293" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Agency</text></g><path d="M420 283.0 H516 M508 276.0 L516 283.0 L508 290.0" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="card" data-id="lbl"><rect x="431.032" y="233" width="77.9365" height="40" rx="20" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="470" y="262" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">Yes</text></g><g class="card" data-id="q2"><rect x="80.5" y="464.5" width="339" height="143" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="108" y="511" font-size="26" font-weight="700" fill="#020101">Does the app ship</text><text x="108" y="545" font-size="26" font-weight="700" fill="#020101">on iOS and Android</text><text x="108" y="579" font-size="26" font-weight="700" fill="#020101">at launch?</text></g><circle cx="80" cy="464" r="20" fill="#E2225F"/><text x="80" y="473" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><g class="card" data-id="q3"><rect x="80.5" y="700.5" width="339" height="143" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="108" y="747" font-size="26" font-weight="700" fill="#020101">Must flows be</text><text x="108" y="781" font-size="26" font-weight="700" fill="#020101">tested with users</text><text x="108" y="815" font-size="26" font-weight="700" fill="#020101">before code?</text></g><circle cx="80" cy="700" r="20" fill="#E2225F"/><text x="80" y="709" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><g class="card" data-id="o2"><rect x="520.5" y="740.5" width="239" height="63" rx="32" fill="#FFE3EC" stroke="#FFE3EC"/><text x="640" y="782" font-size="28" font-weight="800" fill="#E2225F" text-anchor="middle">Freelancer</text></g><path d="M420 772.0 H516 M508 765.0 L516 772.0 L508 779.0" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="card" data-id="lbl"><rect x="437.189" y="722" width="65.6221" height="40" rx="20" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="470" y="751" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">No</text></g><g class="card" data-id="q4"><rect x="80.5" y="936.5" width="339" height="245" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="108" y="1017" font-size="26" font-weight="700" fill="#020101">Does someone on</text><text x="108" y="1051" font-size="26" font-weight="700" fill="#020101">your team recruit,</text><text x="108" y="1085" font-size="26" font-weight="700" fill="#020101">moderate and</text><text x="108" y="1119" font-size="26" font-weight="700" fill="#020101">review test builds?</text></g><circle cx="80" cy="936" r="20" fill="#E2225F"/><text x="80" y="945" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><g class="card" data-id="o3"><rect x="520.5" y="936.5" width="239" height="245" rx="18" fill="#FFFFFF" stroke="#E2225F" stroke-width="2"/><text x="540" y="976" font-size="28" font-weight="800" fill="#E2225F">Freelancer</text><text x="540" y="1010" font-size="28" font-weight="800" fill="#E2225F">+ your PM</text><text x="540" y="1044" font-size="26" font-weight="400" fill="#020101">(for two</text><text x="540" y="1078" font-size="26" font-weight="400" fill="#020101">platforms, one</text><text x="540" y="1112" font-size="26" font-weight="400" fill="#020101">who has</text><text x="540" y="1146" font-size="26" font-weight="400" fill="#020101">shipped both)</text></g><path d="M420 1059.0 H516 M508 1052.0 L516 1059.0 L508 1066.0" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="card" data-id="lbl"><rect x="431.032" y="1009" width="77.9365" height="40" rx="20" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="470" y="1038" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">Yes</text></g><path d="M250.0 372.0 V460 M243.0 452 L250.0 460 L257.0 452" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="card" data-id="lbl"><rect x="263.189" y="398" width="65.6221" height="40" rx="20" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="296" y="427" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">No</text></g><path d="M250.0 608.0 V696 M243.0 688 L250.0 696 L257.0 688" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="card" data-id="lbl"><rect x="263.189" y="634" width="65.6221" height="40" rx="20" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="296" y="663" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">No</text></g><path d="M250.0 844.0 V932 M243.0 924 L250.0 932 L257.0 924" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="card" data-id="lbl"><rect x="257.032" y="870" width="77.9365" height="40" rx="20" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="296" y="899" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">Yes</text></g><path d="M80 536.0 H40 V1059.0 H76" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 1052.0 L76 1059.0 L68 1066.0" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="card" data-id="lbl"><rect x="1.03174" y="717.5" width="77.9365" height="40" rx="20" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="40" y="746.5" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">Yes</text></g><path d="M250.0 1182.0 V1270.0 M243.0 1262.0 L250.0 1270.0 L257.0 1262.0" fill="none" stroke="#020101" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g class="card" data-id="lbl"><rect x="263.189" y="1208" width="65.6221" height="40" rx="20" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="296" y="1237" font-size="26" font-weight="800" fill="#020101" text-anchor="middle">No</text></g><g class="card" data-id="o4"><rect x="80.5" y="1274.5" width="339" height="63" rx="32" fill="#E2225F" stroke="#E2225F"/><text x="250" y="1316" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Agency</text></g></svg>
