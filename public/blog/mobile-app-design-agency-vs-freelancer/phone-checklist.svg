oke-dasharray="4 4"/><path d="M354 488 L207 487" stroke="#E2225F" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="80" cy="238" r="18" fill="#E2225F"/><text x="80" y="247" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="80" cy="288" r="18" fill="#E2225F"/><text x="80" y="297" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="80" cy="354" r="18" fill="#E2225F"/><text x="80" y="363" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><circle cx="80" cy="534" r="18" fill="#E2225F"/><text x="80" y="543" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">7</text><circle cx="354" cy="238" r="18" fill="#E2225F"/><text x="354" y="247" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="354" cy="292" r="18" fill="#E2225F"/><text x="354" y="301" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="354" cy="430" r="18" fill="#E2225F"/><text x="354" y="439" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text><circle cx="354" cy="488" r="18" fill="#E2225F"/><text x="354" y="497" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">8</text></g><g class="card" data-id="i1"><rect x="40.5" y="660.5" width="343" height="217" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="80" cy="700" r="18" fill="#E2225F"/><text x="80" y="709" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="110" y="710" font-size="28" font-weight="800" fill="#020101">Touch targets</text><text x="64" y="754" font-size="26" font-weight="400" fill="#020101">tap small icons with</text><text x="64" y="788" font-size="26" font-weight="400" fill="#020101">your thumb; misses</text><text x="64" y="822" font-size="26" font-weight="400" fill="#020101">point to targets under</text><text x="64" y="856" font-size="26" font-weight="400" fill="#020101">44 pt or 48 dp.</text></g><g class="card" data-id="i2"><rect x="40.5" y="894.5" width="343" height="319" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="80" cy="934" r="18" fill="#E2225F"/><text x="80" y="943" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="110" y="944" font-size="28" font-weight="800" fill="#020101">Back</text><text x="110" y="978" font-size="28" font-weight="800" fill="#020101">navigation</text><text x="64" y="1022" font-size="26" font-weight="400" fill="#020101">on Android, system</text><text x="64" y="1056" font-size="26" font-weight="400" fill="#020101">back from an inner</text><text x="64" y="1090" font-size="26" font-weight="400" fill="#020101">screen should return</text><text x="64" y="1124" font-size="26" font-weight="400" fill="#020101">to the previous</text><text x="64" y="1158" font-size="26" font-weight="400" fill="#020101">screen, not exit the</text><text x="64" y="1192" font-size="26" font-weight="400" fill="#020101">app.</text></g><g class="card" data-id="i3"><rect x="416.5" y="168.5" width="343" height="183" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="456" cy="208" r="18" fill="#E2225F"/><text x="456" y="217" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="486" y="218" font-size="28" font-weight="800" fill="#020101">Larger text</text><text x="486" y="252" font-size="28" font-weight="800" fill="#020101">setting</text><text x="440" y="296" font-size="26" font-weight="400" fill="#020101">raise text size; labels</text><text x="440" y="330" font-size="26" font-weight="400" fill="#020101">should wrap, not clip.</text></g><g class="card" data-id="i4"><rect x="416.5" y="368.5" width="343" height="149" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="456" cy="408" r="18" fill="#E2225F"/><text x="456" y="417" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="486" y="418" font-size="28" font-weight="800" fill="#020101">Dark mode</text><text x="440" y="462" font-size="26" font-weight="400" fill="#020101">text and icons should</text><text x="440" y="496" font-size="26" font-weight="400" fill="#020101">stay readable.</text></g><g class="card" data-id="i5"><rect x="416.5" y="534.5" width="343" height="149" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="456" cy="574" r="18" fill="#E2225F"/><text x="456" y="583" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="486" y="584" font-size="28" font-weight="800" fill="#020101">Empty state</text><text x="440" y="628" font-size="26" font-weight="400" fill="#020101">a new account should</text><text x="440" y="662" font-size="26" font-weight="400" fill="#020101">say what to do first.</text></g><g class="card" data-id="i6"><rect x="416.5" y="700.5" width="343" height="183" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="456" cy="740" r="18" fill="#E2225F"/><text x="456" y="749" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text><text x="486" y="750" font-size="28" font-weight="800" fill="#020101">Error state</text><text x="440" y="794" font-size="26" font-weight="400" fill="#020101">offline or a wrong</text><text x="440" y="828" font-size="26" font-weight="400" fill="#020101">password should</text><text x="440" y="862" font-size="26" font-weight="400" fill="#020101">explain recovery.</text></g><g class="card" data-id="i7"><rect x="416.5" y="900.5" width="343" height="217" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="456" cy="940" r="18" fill="#E2225F"/><text x="456" y="949" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">7</text><text x="486" y="950" font-size="28" font-weight="800" fill="#020101">Onboarding</text><text x="486" y="984" font-size="28" font-weight="800" fill="#020101">length</text><text x="440" y="1028" font-size="26" font-weight="400" fill="#020101">count screens before</text><text x="440" y="1062" font-size="26" font-weight="400" fill="#020101">the app does</text><text x="440" y="1096" font-size="26" font-weight="400" fill="#020101">something useful.</text></g><g class="card" data-id="i8"><rect x="416.5" y="1134.5" width="343" height="183" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><circle cx="456" cy="1174" r="18" fill="#E2225F"/><text x="456" y="1183" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">8</text><text x="486" y="1184" font-size="28" font-weight="800" fill="#020101">Case study</text><text x="440" y="1228" font-size="26" font-weight="400" fill="#020101">it should state scope,</text><text x="440" y="1262" font-size="26" font-weight="400" fill="#020101">platforms, problem</text><text x="440" y="1296" font-size="26" font-weight="400" fill="#020101">and measured results.</text></g></svg>
