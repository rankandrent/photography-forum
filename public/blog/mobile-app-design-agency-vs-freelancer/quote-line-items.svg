<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1518" width="800" height="1518" font-family="Manrope, system-ui, sans-serif"><rect width="800" height="1518" fill="#FBFAFB"/><text x="40" y="76" font-size="40" font-weight="800" fill="#020101">Seven lines in every quote</text><text x="40" y="124" font-size="28" font-weight="600" fill="#6B6B70">Line up both quotes, then price the gaps</text><g class="card" data-id="legend"><rect x="40.5" y="168.5" width="719" height="203" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><rect x="64" y="198" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="81" y="224" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">F</text><text x="116" y="224" font-size="26" font-weight="700" fill="#020101">Freelancer quote</text><rect x="64" y="244" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="81" y="270" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">A</text><text x="116" y="270" font-size="26" font-weight="700" fill="#020101">Agency quote</text><rect x="64" y="290" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="81" y="316" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">$</text><text x="116" y="316" font-size="26" font-weight="700" fill="#020101">Your extra cost</text><path d="M420 192 V326" stroke="#E8E8EB" stroke-width="2"/><circle cx="443" cy="212" r="9" fill="none" stroke="#6B6B70" stroke-width="2.5"/><path d="M450 219 L457 226" stroke="#6B6B70" stroke-width="2.5" stroke-linecap="round"/><text x="470" y="224" font-size="26"><tspan font-weight="700" fill="#020101">Check in each</tspan></text><text x="470" y="258" font-size="26"><tspan font-weight="700" fill="#020101">quote</tspan></text><circle cx="446" cy="299" r="13" fill="#E2225F"/><path d="M451 293 Q446 290 442 293 Q439 297 446 299 Q453 301 450 305 Q446 308 441 305 M446 288 V310" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><text x="470" y="308" font-size="26"><tspan font-weight="700" fill="#E2225F">If missing, your</tspan></text><text x="470" y="342" font-size="26"><tspan font-weight="700" fill="#E2225F">cost is</tspan></text></g><rect x="40.5" y="392.5" width="719" height="1096" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M40.5 412 Q40.5 392.5 60 392.5 H740 Q759.5 392.5 759.5 412" fill="none" stroke="#E2225F" stroke-width="6"/><text x="609" y="436" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">F</text><text x="659" y="436" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">A</text><text x="709" y="436" font-size="26" font-weight="800" fill="#E2225F" text-anchor="middle">$</text><text x="64" y="436" font-size="26" font-weight="800" fill="#6B6B70">Quote line</text><g class="card" data-id="row1"><rect x="41" y="458" width="718" height="146" fill="#FFFFFF"/><text x="64" y="498" font-size="28" font-weight="800" fill="#E2225F">1</text><text x="100" y="498" font-size="28" font-weight="800" fill="#020101">Platforms</text><circle cx="109" cy="526" r="9" fill="none" stroke="#6B6B70" stroke-width="2.5"/><path d="M116 533 L123 540" stroke="#6B6B70" stroke-width="2.5" stroke-linecap="round"/><text x="136" y="538" font-size="26"><tspan font-weight="400" fill="#020101">iOS, Android or both, each to its guidelines</tspan></text><circle cx="112" cy="569" r="13" fill="#E2225F"/><path d="M117 563 Q112 560 108 563 Q105 567 112 569 Q119 571 116 575 Q112 578 107 575 M112 558 V580" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><text x="136" y="578" font-size="26"><tspan font-weight="700" fill="#E2225F">An Android pass bought later</tspan></text><rect x="592" y="472" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><rect x="642" y="472" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><rect x="692" y="472" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/></g><path d="M41 604 H759" stroke="#E8E8EB" stroke-width="1"/><g class="card" data-id="row2"><rect x="41" y="604" width="718" height="146" fill="#FBFAFB"/><text x="64" y="644" font-size="28" font-weight="800" fill="#E2225F">2</text><text x="100" y="644" font-size="28" font-weight="800" fill="#020101">User flows</text><circle cx="109" cy="672" r="9" fill="none" stroke="#6B6B70" stroke-width="2.5"/><path d="M116 679 L123 686" stroke="#6B6B70" stroke-width="2.5" stroke-linecap="round"/><text x="136" y="684" font-size="26"><tspan font-weight="400" fill="#020101">Flows listed by name</tspan></text><circle cx="112" cy="715" r="13" fill="#E2225F"/><path d="M117 709 Q112 706 108 709 Q105 713 112 715 Q119 717 116 721 Q112 724 107 721 M112 704 V726" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><text x="136" y="724" font-size="26"><tspan font-weight="700" fill="#E2225F">Change requests mid-project</tspan></text><rect x="592" y="618" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><rect x="642" y="618" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><rect x="692" y="618" width="34" height="34" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/></g><path d="M41 750 H759" stroke="#E8E8EB" stroke-width="1"/><g class="card" data-id="row3"><rect x="41" y="750" width="718" height="146" fill="#FFFFFF"/><text x="64" y="790" font-size="28" font-weight="800" fill="#E2225F">3</text><text x="100" y="790" font-size="28" font-weight="800" fill="#020101">Test rounds and recruiting</text><circle cx="109" cy="818" r="9" fill="none" stroke="#6B6B70" stroke-width="2.5"/><path d="M116 825 L123 832" stroke="#6B6B70" stroke-width="2.5" stroke-linecap="round"/><text x="136" y="830" font-size="26"><tspan font-weight="400" fill="#020101">Rounds, users per round, who recruits</tspan></text><circle cx="112" cy="861" r="13" fill="#E2225F"/><path d="M117 855 Q1