<text x="506" y="329" font-size="26" font-weight="700" fill="#020101" text-anchor="start">Power users</text>
<circle cx="480" cy="400" r="13" fill="#E2225F" stroke="#E2225F" stroke-width="3"/>
<text x="506" y="409" font-size="26" font-weight="700" fill="#020101" text-anchor="start">Workspace</text>
<text x="506" y="441" font-size="26" font-weight="700" fill="#020101" text-anchor="start">admins</text>
<circle cx="160" cy="340" r="13" fill="#FFFFFF" stroke="#E2225F" stroke-width="3"/>
<text x="186" y="349" font-size="26" font-weight="700" fill="#020101" text-anchor="start">New trials</text>
<circle cx="160" cy="640" r="13" fill="#FFFFFF" stroke="#E2225F" stroke-width="3"/>
<text x="186" y="649" font-size="26" font-weight="700" fill="#020101" text-anchor="start">Occasional</text>
<text x="186" y="681" font-size="26" font-weight="700" fill="#020101" text-anchor="start">billing users</text>
<text x="470" y="610" font-size="26" font-weight="400" fill="#6B6B70" text-anchor="start">Weekly tasks:</text>
<text x="470" y="643" font-size="26" font-weight="400" fill="#6B6B70" text-anchor="start">speed and</text>
<text x="470" y="676" font-size="26" font-weight="400" fill="#6B6B70" text-anchor="start">errors</text>
<line x1="120" y1="834" x2="760" y2="834" stroke="#020101" stroke-width="2"/>
<path d="M748 826 L760 834 L748 842" fill="none" stroke="#020101" stroke-width="2"/>
<line x1="96" y1="810" x2="96" y2="170" stroke="#020101" stroke-width="2"/>
<path d="M88 182 L96 170 L104 182" fill="none" stroke="#020101" stroke-width="2"/>
