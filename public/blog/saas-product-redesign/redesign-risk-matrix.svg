<text x="150" y="548" font-size="32" font-weight="800" fill="#020101" text-anchor="start">Communicate</text>
<text x="150" y="586" font-size="32" font-weight="800" fill="#020101" text-anchor="start">only</text>
<rect x="446" y="496" width="308" height="308" rx="20" fill="#FFFFFF" stroke="#E8E8EB" stroke-width="1"/>
<text x="470" y="548" font-size="32" font-weight="800" fill="#020101" text-anchor="start">Test hardest</text>
