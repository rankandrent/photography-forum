<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 970" width="800" height="970" font-family="Manrope, system-ui, sans-serif">
<rect width="800" height="970" rx="24" fill="#FBFAFB"/>
<text x="48" y="76" font-size="40" font-weight="800" fill="#020101" text-anchor="start">Who carries the risk?</text>
