<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 762" width="1200" height="762" font-family="Manrope, system-ui, sans-serif"><rect width="1200" height="762" rx="24" fill="#FBFAFB"/><text x="18" y="54" font-size="50" font-weight="800" fill="#020101">5-user test plan</text><g class="card"><rect x="490.522" y="14.5" width="273.142" height="53" rx="27.0" fill="#FFE3EC"/><text x="627.093" y="55" font-size="38" font-weight="800" fill="#E2225F" text-anchor="middle">Illustrative</text></g><g class="card"><rect x="10.5" y="80.5" width="1179" height="115" rx="18" fill="#FFE3EC"/><text x="32" y="124" font-size="42" font-weight="800" fill="#E2225F">Hypothesis</text><text x="312.305" y="124" font-size="38" font-weight="600" fill="#020101">physiotherapists will publish open slots</text><text x="32" y="168" font-size="38" font-weight="600" fill="#020101">instead of texting patients.</text></g><g class="card"><rect x="10.5" y="208.5" width="1179" height="275" rx="18" fill="#FFFFFF" stroke="#E8E8EB"/><text x="32" y="250" font-size="42" font-weight="800" fill="#020101">Task 1</text><text x="201.768" y="250" font-size="38" font-weight="600" fill="#020101">&quot;A patient canceled tomorrow at 10. Make</text><text x="32" y="294" font-size="38" font-weight="600" fill="#020101">that time bookable.&quot;</text><path d="M32 318 H1168" stroke="#E8E8EB" stroke-width="1.5"/><text x="32" y="354" font-size="42" font-weight="800" fill="#020101">Task 2</text><text x="201.768" y="354" font-size="38" font-weight="600" fill="#020101">&quot;Send your booking page to a patient who</text><text x="32" y="398" font-size="38" font-weight="600" fill="#020101">wants a slot next week.&quot;</text><path d="M32 422 H1168" stroke="#E8E8EB" stroke-width="1.5"/><text x="32" y="458" font-size="42" font-weight="800" fill="#020101">Task 3</text><text x="201.768" y="458" font-size="38" font-weight="600" fill="#020101">&quot;Check who booked the slot you opened.&quot;</text></g><g class="card"><rect x="10.5" y="496.5" width="499" height="255" rx="18" fill="#FFFFFF" stroke="#E8E8EB"/><text x="32" y="540" font-size="42" font-weight="800" fill="#020101">Observe</text><text x="243.829" y="540" font-size="38" font-weight="600" fill="#020101">where</text><text x="32" y="584" font-size="38" font-weight="600" fill="#020101">each user stalls,</text><text x="32" y="628" font-size="38" font-weight="600" fill="#020101">misreads a label or</text><text x="32" y="672" font-size="38" font-weight="600" fill="#020101">asks for help.</text></g><g class="card"><rect x="522.5" y="496.5" width="667" height="255" rx="18" fill="#FFFFFF" stroke="#E8E8EB"/><text x="544" y="540" font-size="42" font-weight="800" fill="#020101">Score</text><text x="693.198" y="540" font-size="38" font-weight="600" fill="#020101">System Usability</text><text x="544" y="584" font-size="38" font-weight="600" fill="#020101">Scale after the tasks; 68 is</text><text x="544" y="628" font-size="38" font-weight="600" fill="#020101">the average (MeasuringU).</text><path d="M584 668 H1068" stroke="#F1F1F3" stroke-width="12" stroke-linecap="round"/><path d="M584 668 H913.12" stroke="#E2225F" stroke-width="12" stroke-linecap="round"/><circle cx="913.12" cy="668" r="14" fill="#FFFFFF" stroke="#E2225F" stroke-width="5"/><text x="568" y="681" font-size="38" font-weight="700" fill="#6B6B70" text-anchor="end">0</text><text x="1084" y="681" font-size="38" font-weight="700" fill="#6B6B70">100</text><text x="913.12" y="724" font-size="38" font-weight="800" fill="#E2225F" text-anchor="middle">68</text></g></svg>