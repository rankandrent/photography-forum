<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 918" width="800" height="918" font-family="Manrope, system-ui, sans-serif"><rect width="800" height="918" rx="24" fill="#FBFAFB"/><text x="40" y="76" font-size="36" font-weight="800" fill="#020101">Priority 2x2</text><g class="card"><rect x="559.7978515625" y="46" width="200.2021484375" height="42" rx="21" fill="#E2225F"/><text x="659.899" y="76" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">Illustrative</text></g><text x="84" y="140" font-size="26" font-weight="600" fill="#6B6B70">Impact (severity × share of affected sessions)</text><g class="card"><rect x="84.5" y="184.5" width="329" height="326" rx="20" fill="#FFE3EC" stroke="#E8E8EB"/><text x="108" y="236" font-size="28" font-weight="800" fill="#E2225F">Fix this sprint</text><text x="108" y="280" font-size="26" font-weight="400" fill="#020101">high impact, low</text><text x="108" y="316" font-size="26" font-weight="400" fill="#020101">effort (the</text><text x="108" y="352" font-size="26" font-weight="400" fill="#020101">shipping-cost</text><text x="108" y="388" font-size="26" font-weight="400" fill="#020101">surprise).</text><circle cx="124" cy="432" r="14" fill="#E2225F"/><circle cx="124" cy="432" r="22" fill="none" stroke="#E2225F" stroke-width="2" stroke-opacity="0.4"/><text x="156" y="441" font-size="26" font-weight="700" fill="#020101">shipping-cost</text><text x="156" y="475" font-size="26" font-weight="700" fill="#020101">surprise</text></g><g class="card"><rect x="430.5" y="184.5" width="329" height="326" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="454" y="236" font-size="28" font-weight="800" fill="#020101">Plan the project</text><text x="454" y="280" font-size="26" font-weight="400" fill="#020101">high impact, high</text><text x="454" y="316" font-size="26" font-weight="400" fill="#020101">effort, often a</text><text x="454" y="352" font-size="26" font-weight="400" fill="#020101">template redesign.</text></g><g class="card"><rect x="84.5" y="526.5" width="329" height="292" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="108" y="578" font-size="28" font-weight="800" fill="#020101">Batch with the</text><text x="108" y="614" font-size="28" font-weight="800" fill="#020101">next release</text><text x="108" y="658" font-size="26" font-weight="400" fill="#020101">low impact, low</text><text x="108" y="694" font-size="26" font-weight="400" fill="#020101">effort (the gift-wrap</text><text x="108" y="730" font-size="26" font-weight="400" fill="#020101">bug).</text><circle cx="124" cy="774" r="14" fill="#E2225F"/><circle cx="124" cy="774" r="22" fill="none" stroke="#E2225F" stroke-width="2" stroke-opacity="0.4"/><text x="156" y="783" font-size="26" font-weight="700" fill="#020101">gift-wrap bug</text></g><g class="card"><rect x="430.5" y="526.5" width="329" height="292" rx="20" fill="#FBFAFB" stroke="#E8E8EB"/><text x="454" y="578" font-size="28" font-weight="800" fill="#020101">Park</text><text x="454" y="622" font-size="26" font-weight="400" fill="#020101">low impact, high</text><text x="454" y="658" font-size="26" font-weight="400" fill="#020101">effort; revisit if traffic</text><text x="454" y="694" font-size="26" font-weight="400" fill="#020101">to the page grows.</text></g><path d="M58 818 V154 M48 166 L58 152 L68 166" fill="none" stroke="#6B6B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 840 H760 M746 830 L760 840 L746 850" fill="none" stroke="#6B6B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="736" y="888" font-size="26" font-weight="600" fill="#6B6B70" text-anchor="end">Effort (development days)</text></svg>