<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 756" width="1200" height="756" font-family="Manrope, system-ui, sans-serif"><rect width="1200" height="756" rx="24" fill="#FBFAFB"/><g class="card"><rect x="28.5" y="22.5" width="273.142" height="53" rx="27.0" fill="#FFE3EC"/><text x="165.071" y="63" font-size="38" font-weight="800" fill="#E2225F" text-anchor="middle">Illustrative</text></g><text x="324.142" y="66" font-size="50" font-weight="800" fill="#020101">Impact against effort</text><g class="card"><rect x="94.5" y="98.5" width="533" height="279" rx="20" fill="#FFE3EC"/><text x="118" y="149" font-size="42" font-weight="800" fill="#E2225F">Fix this sprint</text><text x="118" y="198" font-size="38" font-weight="600" fill="#020101">high impact, low</text><text x="118" y="242" font-size="38" font-weight="600" fill="#020101">effort (the</text><text x="118" y="286" font-size="38" font-weight="600" fill="#020101">shipping-cost</text><text x="118" y="330" font-size="38" font-weight="600" fill="#020101">surprise).</text></g><g class="card"><rect x="642.5" y="98.5" width="533" height="279" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="666" y="149" font-size="42" font-weight="800" fill="#020101">Plan the project</text><text x="666" y="198" font-size="38" font-weight="600" fill="#020101">high impact, high</text><text x="666" y="242" font-size="38" font-weight="600" fill="#020101">effort, often a</text><text x="666" y="286" font-size="38" font-weight="600" fill="#020101">template redesign.</text></g><g class="card"><rect x="94.5" y="392.5" width="533" height="279" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="118" y="443" font-size="42" font-weight="800" fill="#020101">Batch with the next</text><text x="118" y="491" font-size="42" font-weight="800" fill="#020101">release</text><text x="118" y="540" font-size="38" font-weight="600" fill="#020101">low impact, low effort</text><text x="118" y="584" font-size="38" font-weight="600" fill="#020101">(the gift-wrap bug).</text></g><g class="card"><rect x="642.5" y="392.5" width="533" height="279" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="666" y="443" font-size="42" font-weight="800" fill="#020101">Park</text><text x="666" y="492" font-size="38" font-weight="600" fill="#020101">low impact, high</text><text x="666" y="536" font-size="38" font-weight="600" fill="#020101">effort; revisit if traffic</text><text x="666" y="580" font-size="38" font-weight="600" fill="#020101">to the page grows.</text></g><path d="M66 672 V106 M56 118 l10 -12 l10 12" fill="none" stroke="#6B6B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text transform="translate(54 128) rotate(-90)" x="0" y="0" font-size="38" font-weight="800" fill="#6B6B70" text-anchor="end">High impact</text><text transform="translate(54 672) rotate(-90)" x="0" y="0" font-size="38" font-weight="800" fill="#6B6B70" text-anchor="start">Low impact</text><path d="M94 680 H1168 M1156 670 l12 10 l-12 10" fill="none" stroke="#6B6B70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="722" font-size="38" font-weight="800" fill="#6B6B70">Low effort</text><text x="1136" y="722" font-size="38" font-weight="800" fill="#6B6B70" text-anchor="end">High effort</text></svg>