<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1166" width="800" height="1166" font-family="Manrope, system-ui, sans-serif"><rect width="800" height="1166" rx="24" fill="#FBFAFB"/><text x="40" y="76" font-size="36" font-weight="800" fill="#020101">WCAG 2.2 criteria that hit</text><text x="40" y="120" font-size="36" font-weight="800" fill="#020101">store checkouts</text><rect x="40" y="149" width="64" height="36" rx="10" fill="#E2225F"/><text x="72" y="175" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text><text x="118" y="176" font-size="26" font-weight="600" fill="#6B6B70">Level</text><path d="M235.6953125 179 C223.6953125 167 225.6953125 155 235.6953125 155 C245.6953125 155 247.6953125 167 235.6953125 179 Z" fill="none" stroke="#6B6B70" stroke-width="3" stroke-linejoin="round"/><circle cx="235.6953125" cy="164" r="3.5" fill="#6B6B70"/><text x="259.695" y="176" font-size="26" font-weight="600" fill="#6B6B70">Where it bites</text><path d="M498.4794921875 167 l6 7 l12 -14" fill="none" stroke="#6B6B70" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="529.479" y="176" font-size="26" font-weight="600" fill="#6B6B70">How to test</text><g class="card"><rect x="40.5" y="212.5" width="719" height="150" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 212.5 H124 V362.5 H60 A19.5 19.5 0 0 1 40.5 342.5 V232 A19.5 19.5 0 0 1 60 212.5 Z" fill="#FFE3EC"/><text x="82" y="270" font-size="30" font-weight="800" fill="#E2225F" text-anchor="middle">A</text><text x="156" y="262" font-size="28" font-weight="800" fill="#020101">3.3.7 Redundant Entry</text><path d="M166 310 C154 298 156 286 166 286 C176 286 178 298 166 310 Z" fill="none" stroke="#E2225F" stroke-width="3" stroke-linejoin="round"/><circle cx="166" cy="295" r="3.5" fill="#E2225F"/><text x="186" y="308" font-size="26" font-weight="400" fill="#020101">Billing address typed again</text><path d="M157 335 l6 7 l12 -14" fill="none" stroke="#E2225F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="344" font-size="26" font-weight="400" fill="#020101">No detail asked twice</text></g><g class="card"><rect x="40.5" y="376.5" width="719" height="186" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 376.5 H124 V562.5 H60 A19.5 19.5 0 0 1 40.5 542.5 V396 A19.5 19.5 0 0 1 60 376.5 Z" fill="#E2225F"/><text x="82" y="434" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">AA</text><text x="156" y="426" font-size="28" font-weight="800" fill="#020101">3.3.8 Accessible Authentication</text><text x="156" y="462" font-size="28" font-weight="800" fill="#020101">(Minimum)</text><path d="M166 510 C154 498 156 486 166 486 C176 486 178 498 166 510 Z" fill="none" stroke="#E2225F" stroke-width="3" stroke-linejoin="round"/><circle cx="166" cy="495" r="3.5" fill="#E2225F"/><text x="186" y="508" font-size="26" font-weight="400" fill="#020101">Login and one-time codes</text><path d="M157 535 l6 7 l12 -14" fill="none" stroke="#E2225F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="544" font-size="26" font-weight="400" fill="#020101">Paste and password managers work</text></g><g class="card"><rect x="40.5" y="576.5" width="719" height="186" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 576.5 H124 V762.5 H60 A19.5 19.5 0 0 1 40.5 742.5 V596 A19.5 19.5 0 0 1 60 576.5 Z" fill="#E2225F"/><text x="82" y="634" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">AA</text><text x="156" y="626" font-size="28" font-weight="800" fill="#020101">2.4.11 Focus Not Obscured</text><text x="156" y="662" font-size="28" font-weight="800" fill="#020101">(Minimum)</text><path d="M166 710 C154 698 156 686 166 686 C176 686 178 698 166 710 Z" fill="none" stroke="#E2225F" stroke-width="3" stroke-linejoin="round"/><circle cx="166" cy="695" r="3.5" fill="#E2225F"/><text x="186" y="708" font-size="26" font-weight="400" fill="#020101">Sticky bars, cookie banners, chat widgets</text><path d="M157 735 l6 7 l12 -14" fill="none" stroke="#E2225F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="744" font-size="26" font-weight="400" fill="#020101">Tab through checkout</text></g><g class="card"><rect x="40.5" y="776.5" width="719" height="186" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 776.5 H124 V962.5 H60 A19.5 19.5 0 0 1 40.5 942.5 V796 A19.5 19.5 0 0 1 60 776.5 Z" fill="#E2225F"/><text x="82" y="834" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">AA</text><text x="156" y="826" font-size="28" font-weight="800" fill="#020101">2.5.8 Target Size (Minimum)</text><path d="M166 874 C154 862 156 850 166 850 C176 850 178 862 166 874 Z" fill="none" stroke="#E2225F" stroke-width="3" stroke-linejoin="round"/><circle cx="166" cy="859" r="3.5" fill="#E2225F"/><text x="186" y="872" font-size="26" font-weight="400" fill="#020101">Swatches, quantity steppers</text><path d="M157 899 l6 7 l12 -14" fill="none" stroke="#E2225F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="908" font-size="26" font-weight="400" fill="#020101">24 × 24 Cascading Style Sheets (CSS)</text><text x="186" y="944" font-size="26" font-weight="400" fill="#020101">pixels, or enough spacing</text></g><g class="card"><rect x="40.5" y="976.5" width="719" height="150" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 976.5 H124 V1126.5 H60 A19.5 19.5 0 0 1 40.5 1106.5 V996 A19.5 19.5 0 0 1 60 976.5 Z" fill="#E2225F"/><text x="82" y="1034" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">AA</text><text x="156" y="1026" font-size="28" font-weight="800" fill="#020101">1.4.3 Contrast (Minimum)</text><path d="M166 1074 C154 1062 156 1050 166 1050 C176 1050 178 1062 166 1074 Z" fill="none" stroke="#E2225F" stroke-width="3" stroke-linejoin="round"/><circle cx="166" cy="1059" r="3.5" fill="#E2225F"/><text x="186" y="1072" font-size="26" font-weight="400" fill="#020101">Prices, sale labels, buttons</text><path d="M157 1099 l6 7 l12 -14" fill="none" stroke="#E2225F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="1108" font-size="26" font-weight="400" fill="#020101">4.5:1 for body text</text></g></svg>