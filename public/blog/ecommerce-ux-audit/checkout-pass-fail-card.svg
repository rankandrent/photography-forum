<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1364" width="800" height="1364" font-family="Manrope, system-ui, sans-serif"><rect width="800" height="1364" rx="24" fill="#FBFAFB"/><text x="40" y="76" font-size="36" font-weight="800" fill="#020101">Checkout UX audit card</text><g class="card"><rect x="40.5" y="112.5" width="719" height="300" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 112.5 H116 V412.5 H60 A19.5 19.5 0 0 1 40.5 392.5 V132 A19.5 19.5 0 0 1 60 112.5 Z" fill="#FFE3EC"/><path d="M64 150 V138 H76 L94 156 L82 168 Z" fill="none" stroke="#E2225F" stroke-width="2.5" stroke-linejoin="round"/><circle cx="71" cy="145" r="3" fill="#E2225F"/><text x="140" y="162" font-size="28" font-weight="800" fill="#E2225F">Cost</text><rect x="140" y="181" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="206" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">1</text><text x="214" y="206" font-size="26" font-weight="400" fill="#020101">Shipping and taxes shown in the cart.</text><rect x="140" y="235" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="260" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">2</text><text x="214" y="260" font-size="26" font-weight="400" fill="#020101">Cart editable in place: quantity,</text><text x="214" y="296" font-size="26" font-weight="400" fill="#020101">remove, variant.</text><rect x="140" y="325" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="350" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">3</text><text x="214" y="350" font-size="26" font-weight="400" fill="#020101">A promo code field that does not send</text><text x="214" y="386" font-size="26" font-weight="400" fill="#020101">shoppers hunting for codes.</text></g><g class="card"><rect x="40.5" y="428.5" width="719" height="156" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 428.5 H116 V584.5 H60 A19.5 19.5 0 0 1 40.5 564.5 V448 A19.5 19.5 0 0 1 60 428.5 Z" fill="#FFE3EC"/><circle cx="78" cy="463" r="7" fill="none" stroke="#E2225F" stroke-width="2.5"/><path d="M64 485 C64 472 92 472 92 485" fill="none" stroke="#E2225F" stroke-width="2.5" stroke-linecap="round"/><text x="140" y="478" font-size="28" font-weight="800" fill="#E2225F">Account</text><rect x="140" y="497" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="522" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">4</text><text x="214" y="522" font-size="26" font-weight="400" fill="#020101">Guest checkout by default; account</text><text x="214" y="558" font-size="26" font-weight="400" fill="#020101">offered after the order.</text></g><g class="card"><rect x="40.5" y="600.5" width="719" height="498" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 600.5 H116 V1098.5 H60 A19.5 19.5 0 0 1 40.5 1078.5 V620 A19.5 19.5 0 0 1 60 600.5 Z" fill="#FFE3EC"/><rect x="63" y="626" width="30" height="12" rx="3" fill="none" stroke="#E2225F" stroke-width="2.5"/><rect x="63" y="644" width="30" height="12" rx="3" fill="none" stroke="#E2225F" stroke-width="2.5"/><text x="140" y="650" font-size="28" font-weight="800" fill="#E2225F">Form</text><rect x="140" y="669" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="694" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">5</text><text x="214" y="694" font-size="26" font-weight="400" fill="#020101">Form fields counted per step.</text><rect x="140" y="723" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="748" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">6</text><text x="214" y="748" font-size="26" font-weight="400" fill="#020101">Address autocomplete.</text><rect x="140" y="777" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="802" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">7</text><text x="214" y="802" font-size="26" font-weight="400" fill="#020101">Billing address defaults to shipping</text><text x="214" y="838" font-size="26" font-weight="400" fill="#020101">address.</text><rect x="140" y="867" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="892" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">8</text><text x="214" y="892" font-size="26" font-weight="400" fill="#020101">Numeric keyboards for card and phone</text><text x="214" y="928" font-size="26" font-weight="400" fill="#020101">fields.</text><rect x="140" y="957" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="982" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">9</text><text x="214" y="982" font-size="26" font-weight="400" fill="#020101">Inline errors that say how to fix the</text><text x="214" y="1018" font-size="26" font-weight="400" fill="#020101">field.</text><rect x="140" y="1047" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="1072" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">10</text><text x="214" y="1072" font-size="26" font-weight="400" fill="#020101">Entered data kept after an error.</text></g><g class="card"><rect x="40.5" y="1114.5" width="719" height="210" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><path d="M60 1114.5 H116 V1324.5 H60 A19.5 19.5 0 0 1 40.5 1304.5 V1134 A19.5 19.5 0 0 1 60 1114.5 Z" fill="#FFE3EC"/><path d="M78 1139 L92 1145 V1155 C92 1164 86 1169 78 1173 C70 1169 64 1164 64 1155 V1145 Z" fill="none" stroke="#E2225F" stroke-width="2.5" stroke-linejoin="round"/><path d="M73 1156 l4 4 l7 -8" fill="none" stroke="#E2225F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="1164" font-size="28" font-weight="800" fill="#E2225F">Trust</text><rect x="140" y="1183" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="1208" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">11</text><text x="214" y="1208" font-size="26" font-weight="400" fill="#020101">Order summary at every step.</text><rect x="140" y="1237" width="30" height="30" rx="7" fill="#FFFFFF" stroke="#020101" stroke-width="2"/><text x="190" y="1262" font-size="26" font-weight="800" fill="#6B6B70" text-anchor="middle">12</text><text x="214" y="1262" font-size="26" font-weight="400" fill="#020101">Payment methods, wallets included,</text><text x="214" y="1298" font-size="26" font-weight="400" fill="#020101">shown before the payment step.</text></g></svg>