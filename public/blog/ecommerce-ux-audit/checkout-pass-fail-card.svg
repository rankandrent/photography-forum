<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 906" width="1200" height="906" font-family="Manrope, system-ui, sans-serif"><rect width="1200" height="906" rx="24" fill="#FBFAFB"/><g class="card"><rect x="6.5" y="6.5" width="588" height="893" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="20" y="51" font-size="42" font-weight="800" fill="#E2225F">Cost</text><path d="M140.754 37 H581" stroke="#FFE3EC" stroke-width="3"/><rect x="20" y="71" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="76" y="98" font-size="38" font-weight="800" fill="#E2225F">1.</text><text x="130.105" y="98" font-size="38" font-weight="600" fill="#020101">Shipping and taxes</text><text x="76" y="142" font-size="38" font-weight="600" fill="#020101">shown in the cart.</text><rect x="20" y="161" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="76" y="188" font-size="38" font-weight="800" fill="#E2225F">2.</text><text x="130.105" y="188" font-size="38" font-weight="600" fill="#020101">Cart editable in</text><text x="76" y="232" font-size="38" font-weight="600" fill="#020101">place: quantity,</text><text x="76" y="276" font-size="38" font-weight="600" fill="#020101">remove, variant.</text><rect x="20" y="295" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="76" y="322" font-size="38" font-weight="800" fill="#E2225F">3.</text><text x="130.105" y="322" font-size="38" font-weight="600" fill="#020101">A promo code field</text><text x="76" y="366" font-size="38" font-weight="600" fill="#020101">that does not send</text><text x="76" y="410" font-size="38" font-weight="600" fill="#020101">shoppers hunting for</text><text x="76" y="454" font-size="38" font-weight="600" fill="#020101">codes.</text><text x="20" y="507" font-size="42" font-weight="800" fill="#E2225F">Account</text><path d="M227.03 493 H581" stroke="#FFE3EC" stroke-width="3"/><rect x="20" y="527" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="76" y="554" font-size="38" font-weight="800" fill="#E2225F">4.</text><text x="130.105" y="554" font-size="38" font-weight="600" fill="#020101">Guest checkout by</text><text x="76" y="598" font-size="38" font-weight="600" fill="#020101">default; account</text><text x="76" y="642" font-size="38" font-weight="600" fill="#020101">offered after the order.</text><text x="20" y="695" font-size="42" font-weight="800" fill="#E2225F">Form</text><path d="M158.021 681 H581" stroke="#FFE3EC" stroke-width="3"/><rect x="20" y="715" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="76" y="742" font-size="38" font-weight="800" fill="#E2225F">5.</text><text x="130.105" y="742" font-size="38" font-weight="600" fill="#020101">Form fields counted</text><text x="76" y="786" font-size="38" font-weight="600" fill="#020101">per step.</text><rect x="20" y="805" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="76" y="832" font-size="38" font-weight="800" fill="#E2225F">6.</text><text x="130.105" y="832" font-size="38" font-weight="600" fill="#020101">Address</text><text x="76" y="876" font-size="38" font-weight="600" fill="#020101">autocomplete.</text></g><g class="card"><rect x="605.5" y="6.5" width="588" height="893" rx="20" fill="#FFFFFF" stroke="#E8E8EB"/><text x="619" y="51" font-size="42" font-weight="800" fill="#E2225F">Form</text><path d="M757.021 37 H1180" stroke="#FFE3EC" stroke-width="3"/><rect x="619" y="71" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="675" y="98" font-size="38" font-weight="800" fill="#E2225F">7.</text><text x="729.105" y="98" font-size="38" font-weight="600" fill="#020101">Billing address</text><text x="675" y="142" font-size="38" font-weight="600" fill="#020101">defaults to shipping</text><text x="675" y="186" font-size="38" font-weight="600" fill="#020101">address.</text><rect x="619" y="205" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="675" y="232" font-size="38" font-weight="800" fill="#E2225F">8.</text><text x="729.105" y="232" font-size="38" font-weight="600" fill="#020101">Numeric keyboards</text><text x="675" y="276" font-size="38" font-weight="600" fill="#020101">for card and phone</text><text x="675" y="320" font-size="38" font-weight="600" fill="#020101">fields.</text><rect x="619" y="339" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="675" y="366" font-size="38" font-weight="800" fill="#E2225F">9.</text><text x="729.105" y="366" font-size="38" font-weight="600" fill="#020101">Inline errors that</text><text x="675" y="410" font-size="38" font-weight="600" fill="#020101">say how to fix the</text><text x="675" y="454" font-size="38" font-weight="600" fill="#020101">field.</text><rect x="619" y="473" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="675" y="500" font-size="38" font-weight="800" fill="#E2225F">10.</text><text x="755.546" y="500" font-size="38" font-weight="600" fill="#020101">Entered data kept</text><text x="675" y="544" font-size="38" font-weight="600" fill="#020101">after an error.</text><text x="619" y="597" font-size="42" font-weight="800" fill="#E2225F">Trust</text><path d="M759.339 583 H1180" stroke="#FFE3EC" stroke-width="3"/><rect x="619" y="617" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="675" y="644" font-size="38" font-weight="800" fill="#E2225F">11.</text><text x="755.546" y="644" font-size="38" font-weight="600" fill="#020101">Order summary at</text><text x="675" y="688" font-size="38" font-weight="600" fill="#020101">every step.</text><rect x="619" y="707" width="36" height="36" rx="8" fill="#FFFFFF" stroke="#020101" stroke-width="3"/><text x="675" y="734" font-size="38" font-weight="800" fill="#E2225F">12.</text><text x="755.546" y="734" font-size="38" font-weight="600" fill="#020101">Payment methods,</text><text x="675" y="778" font-size="38" font-weight="600" fill="#020101">wallets included,</text><text x="675" y="822" font-size="38" font-weight="600" fill="#020101">shown before the</text><text x="675" y="866" font-size="38" font-weight="600" fill="#020101">payment step.</text></g></svg>