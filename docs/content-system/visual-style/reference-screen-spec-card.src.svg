          <rect x="87" y="60" width="32" height="17" rx="8.5" fill="none" stroke="#D8D1DD"/><text x="103" y="71.5" class="uim" text-anchor="middle">Wed</text>
        </g>
        <g font-size="8.5">
          <rect x="15" y="88" width="114" height="40" rx="12" fill="#F3EEF5"/>
          <text x="25" y="104" class="ui" font-weight="800">09:30</text><text x="25" y="117" class="uim" font-size="7.5">45 min · Room 2</text>
          <rect x="15" y="134" width="114" height="40" rx="12" fill="#F3EEF5"/>
          <text x="25" y="150" class="ui" font-weight="800">13:00</text><text x="25" y="163" class="uim" font-size="7.5">30 min · Room 1</text>
          <rect x="15" y="180" width="114" height="40" rx="12" fill="#F3EEF5"/>
          <text x="25" y="196" class="ui" font-weight="800">16:45</text><text x="25" y="209" class="uim" font-size="7.5">45 min · Room 2</text>
        </g>
        <rect x="91" y="228" width="34" height="34" rx="11" fill="#E2225F"/>
        <path d="M108 237 v16 M100 245 h16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="52" y="268" width="40" height="3" rx="1.5" fill="#14111F"/>
      </g>
    </g>
    <!-- redline: FAB 48dp -->
    <rect x="144" y="256" width="44" height="44" rx="7" fill="#E2225F" fill-opacity=".08" stroke="#E2225F" stroke-width="1.4" stroke-dasharray="4 3"/>
    <line x1="144" y1="308" x2="188" y2="308" stroke="#E2225F" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="196" y1="256" x2="196" y2="300" stroke="#E2225F" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <g transform="translate(184 226)"><rect width="50" height="20" rx="6" fill="#E2225F"/><text x="25" y="14" class="tag" text-anchor="middle">48 dp</text></g>

    <text x="24" y="369" class="lab">ANDROID HIT TARGET</text>
    <text x="24" y="413" class="num">48×48</text>
    <text x="24" y="437" class="unit">density-independent</text>
    <text x="24" y="455" class="unit">pixels (dp)</text>
    <line x1="24" y1="480" x2="234" y2="480" stroke="#EFEAF2"/>
    <text x="24" y="519" class="src">Material Design 3</text>
  </g>

  <!-- ================= Web ================= -->
  <g transform="translate(612 152)">
    <rect width="258" height="547" rx="22" fill="#FFFFFF" stroke="#EEE8F1" filter="url(#card)"/>
    <rect x="12" y="12" width="234" height="320" rx="10" fill="url(#stage)"/>
    <g transform="translate(22 60)" filter="url(#dev)">
      <rect width="214" height="224" rx="12" fill="#FFFFFF"/>
      <path d="M0 12 a12 12 0 0 1 12 -12 h190 a12 12 0 0 1 12 12 v20 h-214 z" fill="#EFEAF2"/>
      <circle cx="15" cy="16" r="4" fill="#FF5F57"/><circle cx="28" cy="16" r="4" fill="#FEBC2E"/><circle cx="41" cy="16" r="4" fill="#28C840"/>
      <rect x="56" y="8" width="148" height="16" rx="8" fill="#FFFFFF"/>
      <text x="66" y="19.5" font-size="8" class="uim">app.example.com/settings</text>
      <rect x="0" y="32" width="54" height="192" fill="#FAF8FB"/>
      <g font-size="8"><rect x="8" y="44" width="38" height="14" rx="4" fill="#FFE3EC"/><text x="27" y="54" text-anchor="middle" font-weight="700" fill="#E2225F">Alerts</text></g>
      <text x="66" y="56" font-size="11" font-weight="800" fill="#14111F">Notifications</text>
      <g font-size="8.5">
        <rect x="66" y="72" width="12" height="12" rx="3" fill="#E2225F"/><path d="M68.5 78 l2.5 2.5 l4.5 -5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        <text x="86" y="81.5" class="ui">Email reminders</text>
        <rect x="66" y="98" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#B9B3C0" stroke-width="1.3"/>
        <text x="86" y="107.5" class="ui">SMS reminders</text>
        <rect x="66" y="124" width="12" height="12" rx="3" fill="#E2225F"/><path d="M68.5 130 l2.5 2.5 l4.5 -5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        <text x="86" y="133.5" class="ui">Weekly summary</text>
      </g>
      <line x1="66" y1="156" x2="200" y2="156" stroke="#F0ECF2"/>
      <rect x="66" y="172" width="58" height="22" rx="6" fill="#14111F"/><text x="95" y="186.5" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">Save</text>
      <text x="134" y="186.5" font-size="8.5" class="uim">Cancel</text>
      <path d="M79 108 l0 15 l3.8 -3.6 l2.8 5.8 l2.6 -1.2 l-2.8 -5.7 l5.2 0 z" fill="#14111F" stroke="#FFFFFF" stroke-width="1"/>
    </g>
    <!-- redline: 24px around 12px checkbox -->
    <rect x="82" y="152" width="24" height="24" rx="5" fill="#E2225F" fill-opacity=".08" stroke="#E2225F" stroke-width="1.4" stroke-dasharray="4 3"/>
        <g transform="translate(24 154)"><rect width="50" height="20" rx="6" fill="#E2225F"/><text x="25" y="14" class="tag" text-anchor="middle">24 px</text></g>

    <text x="24" y="369" class="lab">WEB MINIMUM TARGET</text>
    <text x="24" y="413" class="num">24×24</text>
    <text x="24" y="437" class="unit">CSS pixels</text>
    <line x1="24" y1="462" x2="234" y2="462" stroke="#EFEAF2"/>
    <text x="24" y="501" class="src">WCAG 2.2, 2.5.8,</text>
    <text x="24" y="519" class="src">level AA</text>
  </g>

  <!-- ================= Contrast ================= -->
  <g transform="translate(894 152)">
    <rect width="258" height="547" rx="22" fill="#FFFFFF" stroke="#EEE8F1" filter="url(#card)"/>
    <rect x="12" y="12" width="234" height="320" rx="10" fill="url(#stage)"/>
    <!-- pass -->
    <g transform="translate(26 32)" filter="url(#dev)">
      <rect width="206" height="104" rx="14" fill="#FFFFFF"/>
      <text x="16" y="30" font-size="12" font-weight="800" fill="#3D3846">Visit confirmed</text>
      <text x="16" y="48" font-size="10" font-weight="500" fill="#3D3846">Monday at 10:00 with your</text>
      <text x="16" y="62" font-size="10" font-weight="500" fill="#3D3846">physiotherapist.</text>
      <g transform="translate(16 74)"><rect width="66" height="20" rx="10" fill="#E5F5EC"/><circle cx="11" cy="10" r="5.5" fill="#1F9D62"/><path d="M8.3 10 l1.9 1.9 l3.6 -3.8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/><text x="21" y="14" font-size="10" font-weight="800" fill="#17784F">11.3:1</text></g>
      <rect x="168" y="76" width="16" height="16" rx="4" fill="#3D3846"/>
    </g>
    <!-- fail -->
    <g transform="translate(26 152)" filter="url(#dev)">
      <rect width="206" height="104" rx="14" fill="#FFFFFF"/>
      <text x="16" y="30" font-size="12" font-weight="800" fill="#B9B3C0">Visit confirmed</text>
      <text x="16" y="48" font-size="10" font-weight="500" fill="#B9B3C0">Monday at 10:00 with your</text>
      <text x="16" y="62" font-size="10" font-weight="500" fill="#B9B3C0">physiotherapist.</text>
      <g transform="translate(16 74)"><rect width="58" height="20" rx="10" fill="#FCE9EC"/><circle cx="11" cy="10" r="5.5" fill="#D33A54"/><path d="M8.7 7.7 l4.6 4.6 M13.3 7.7 l-4.6 4.6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/><text x="21" y="14" font-size="10" font-weight="800" fill="#B4233C">2.0:1</text></g>
      <rect x="168" y="76" width="16" height="16" rx="4" fill="#B9B3C0"/>
    </g>
    <!-- ratio scale -->
    <g transform="translate(26 280)">
      <rect width="206" height="8" rx="4" fill="#EEE9F1"/>
      <rect width="206" height="8" rx="4" fill="#1F9D62" opacity=".18"/>
      <rect x="0" width="36" height="8" rx="4" fill="#D33A54" opacity=".35"/>
      <line x1="36" y1="-6" x2="36" y2="14" stroke="#E2225F" stroke-width="2"/>
      <text x="36" y="32" font-size="10" font-weight="800" fill="#E2225F" text-anchor="middle">4.5</text>
      <text x="0" y="32" font-size="10" font-weight="700" fill="#8F889A">1</text>
      <text x="206" y="32" font-size="10" font-weight="700" fill="#8F889A" text-anchor="end">21</text>
    </g>

    <text x="24" y="369" class="lab">BODY TEXT CONTRAST</text>
    <text x="24" y="413" class="num">4.5:1</text>
    <text x="24" y="437" class="unit">text to background</text>
    <line x1="24" y1="462" x2="234" y2="462" stroke="#EFEAF2"/>
    <text x="24" y="501" class="src">WCAG 2.2, 1.4.3,</text>
    <text x="24" y="519" class="src">level AA</text>
  </g>
</svg>
