<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 747" width="1200" height="747" font-family="Manrope, system-ui, sans-serif">
  <style>/*FONTS*/
    .eyebrow{font-size:13px;font-weight:800;letter-spacing:2.2px;fill:#E2225F}
    .title{font-size:30px;font-weight:800;fill:#14111F;letter-spacing:-0.4px}
    .sub{font-size:16px;font-weight:500;fill:#6E6878}
    .lab{font-size:12.5px;font-weight:800;letter-spacing:1.6px;fill:#8F889A}
    .num{font-size:40px;font-weight:800;fill:#14111F;letter-spacing:-1px}
    .unit{font-size:15px;font-weight:700;fill:#E2225F}
    .src{font-size:14.5px;font-weight:600;fill:#5E5868}
    .ui{font-weight:600;fill:#2B2733}
    .uim{font-weight:500;fill:#8F889A}
    .tag{font-size:11px;font-weight:800;fill:#FFFFFF}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F2F7"/></linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF5F8"/><stop offset="1" stop-color="#F7F3F9"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A2732"/><stop offset=".5" stop-color="#17151D"/><stop offset="1" stop-color="#2A2732"/></linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2A1640" flood-opacity="0.07"/></filter>
    <filter id="dev" x="-40%" y="-20%" width="180%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2A1640" flood-opacity="0.22"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#E2225F" stroke-width="1.8" stroke-linecap="round"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#EAE4EE"/></pattern>
    <clipPath id="ios"><rect x="6" y="6" width="132" height="268" rx="25"/></clipPath>
    <clipPath id="and"><rect x="5" y="5" width="134" height="270" rx="19"/></clipPath>
  </defs>

  <rect width="1200" height="747" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="747" rx="28" fill="url(#grid)"/>

  <text x="48" y="58" class="eyebrow">SCREEN SPEC CARD</text>
  <text x="48" y="96" class="title">Touch targets and contrast, per platform</text>
  <text x="48" y="124" class="sub">The four numbers to set before the UI pass</text>
  <g transform="translate(964 67)">
    <rect width="188" height="36" rx="18" fill="#FFFFFF" stroke="#ECE6EF"/>
    <rect x="14" y="12" width="12" height="12" rx="3" fill="none" stroke="#E2225F" stroke-width="1.6" stroke-dasharray="3 2"/>
    <text x="36" y="23" font-size="13" font-weight="700" fill="#5E5868">= minimum tap area</text>
  </g>

  <!-- ================= iOS ================= -->
  <g transform="translate(48 152)">
    <rect width="258" height="547" rx="22" fill="#FFFFFF" stroke="#EEE8F1" filter="url(#card)"/>
    <rect x="12" y="12" width="234" height="320" rx="10" fill="url(#stage)"/>
    <g transform="translate(57 32)" filter="url(#dev)">
      <rect x="-2" y="64" width="3" height="24" rx="1.5" fill="#1C1A22"/><rect x="-2" y="96" width="3" height="40" rx="1.5" fill="#1C1A22"/><rect x="143" y="90" width="3" height="52" rx="1.5" fill="#1C1A22"/>
      <rect width="144" height="280" rx="31" fill="url(#body)"/>
      <rect x="1.5" y="1.5" width="141" height="277" rx="29.5" fill="none" stroke="#55505E" stroke-width="1"/>
      <g clip-path="url(#ios)">
        <rect x="6" y="6" width="132" height="268" fill="#FBFAFC"/>
        <text x="20" y="25" font-size="8.5" class="ui">9:41</text>
        <rect x="49" y="13" width="46" height="13" rx="6.5" fill="#0E0D12"/>
        <rect x="111" y="18" width="15" height="6.5" rx="2" fill="none" stroke="#2B2733" stroke-width="1"/><rect x="112.5" y="19.5" width="10" height="3.5" rx="1" fill="#2B2733"/>
        <path d="M118 42 v12 M112 48 h12" stroke="#E2225F" stroke-width="2" stroke-linecap="round"/>
        <text x="16" y="70" font-size="15" font-weight="800" fill="#14111F">Visits</text>
        <rect x="16" y="80" width="112" height="20" rx="6" fill="#EFECF2"/>
        <rect x="18" y="82" width="54" height="16" rx="5" fill="#FFFFFF"/>
        <text x="45" y="93.5" font-size="8" class="ui" text-anchor="middle">Today</text>
        <text x="100" y="93.5" font-size="8" class="uim" text-anchor="middle">Week</text>
        <g font-size="8.5">
          <rect x="16" y="110" width="112" height="34" rx="9" fill="#FFFFFF" stroke="#EEEAF1"/>
          <text x="25" y="124" class="ui" font-weight="800">10:00</text><text x="25" y="136" class="uim" font-size="7.5">Initial assessment</text>
          <path d="M118 123 l3 4 l-3 4" fill="none" stroke="#B9B3C0" stroke-width="1.4" stroke-linecap="round"/>
          <rect x="16" y="150" width="112" height="34" rx="9" fill="#FFFFFF" stroke="#EEEAF1"/>
          <text x="25" y="164" class="ui" font-weight="800">11:30</text><text x="25" y="176" class="uim" font-size="7.5">Follow-up visit</text>
          <path d="M118 163 l3 4 l-3 4" fill="none" stroke="#B9B3C0" stroke-width="1.4" stroke-linecap="round"/>
          <rect x="16" y="190" width="112" height="34" rx="9" fill="#FFF0F5" stroke="#FAD6E2"/>
          <text x="25" y="204" font-weight="800" fill="#E2225F">14:15</text><text x="25" y="216" class="uim" font-size="7.5">Open slot</text>
        </g>
        <rect x="16" y="234" width="112" height="26" rx="13" fill="#E2225F"/>
        <text x="72" y="250.5" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle">Book slot</text>
        <rect x="50" y="266" width="44" height="3.5" rx="1.75" fill="#14111F"/>
      </g>
    </g>
    <!-- redline: + button -->
    <rect x="160" y="65" width="30" height="30" rx="5" fill="#E2225F" fill-opacity=".08" stroke="#E2225F" stroke-width="1.4" stroke-dasharray="4 3"/>
        <line x1="198" y1="65" x2="198" y2="95" stroke="#E2225F" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <g transform="translate(184 34)"><rect width="46" height="20" rx="6" fill="#E2225F"/><text x="23" y="14" class="tag" text-anchor="middle">44 pt</text></g>

    <text x="24" y="369" class="lab">iOS HIT TARGET</text>
    <text x="24" y="413" class="num">44×44</text>
    <text x="24" y="437" class="unit">points (pt)</text>
    <line x1="24" y1="462" x2="234" y2="462" stroke="#EFEAF2"/>
    <text x="24" y="501" class="src">Apple Human Interface</text>
    <text x="24" y="519" class="src">Guidelines</text>
  </g>

  <!-- ================= Android ================= -->
  <g transform="translate(330 152)">
    <rect width="258" height="547" rx="22" fill="#FFFFFF" stroke="#EEE8F1" filter="url(#card)"/>
    <rect x="12" y="12" width="234" height="320" rx="10" fill="url(#stage)"/>
    <g transform="translate(57 32)" filter="url(#dev)">
      <rect x="143" y="70" width="3" height="30" rx="1.5" fill="#26232D"/><rect x="143" y="108" width="3" height="20" rx="1.5" fill="#26232D"/>
      <rect width="144" height="280" rx="24" fill="url(#body)"/>
      <rect x="1.5" y="1.5" width="141" height="277" rx="22.5" fill="none" stroke="#55505E" stroke-width="1"/>
      <g clip-path="url(#and)">
        <rect x="5" y="5" width="134" height="270" fill="#FCF8FB"/>
        <text x="16" y="21" font-size="8.5" class="ui">12:30</text>
        <circle cx="72" cy="17" r="4" fill="#0E0D12"/>
        <g fill="#2B2733"><rect x="108" y="15" width="2.5" height="6" rx="1"/><rect x="112" y="13" width="2.5" height="8" rx="1"/><rect x="117" y="14" width="11" height="7" rx="2"/></g>
        <g stroke="#2B2733" stroke-width="1.6" stroke-linecap="round"><line x1="16" y1="38" x2="27" y2="38"/><line x1="16" y1="43" x2="27" y2="43"/><line x1="16" y1="48" x2="27" y2="48"/></g>
        <text x="36" y="47" font-size="12" font-weight="800" fill="#14111F">Open slots</text>
        <g font-size="7.5">
          <rect x="15" y="60" width="32" height="17" rx="8.5" fill="#FFD9E6"/><text x="31" y="71.5" class="ui" text-anchor="middle">Mon</text>
